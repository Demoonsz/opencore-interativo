        if (document.getElementById("hardware-preview").open ||
            document.getElementById("tree-preview").open) {
            toast(L("Feche a prévia antes de trocar o idioma. Nenhum dado foi descartado.", "Close the preview before switching languages. No data was discarded."));
            return;
        }
        switchGuideLanguage(guideLanguage === "en" ? "pt-BR" : "en", state, {
            view,
            groupFilter,
            query,
            taskFilter,
            kextFilter,
            activeChapter,
            activeExample,
            lastPrimaryView,
            details: [...document.querySelectorAll("details")].map((item, index) => ({
                id: item.id,
                index,
                open: item.open,
            })),
            detailCount: document.querySelectorAll("details").length,
            scroll: window.scrollY,
        });
        return;
    }
    if (action === "show-usb-options") {
        const extra = document.getElementById("assembly-extras");
        if (extra)
            extra.open = true;
        const card = document.querySelector('[data-plan-card="usbtoolbox"]');
        card?.scrollIntoView({ behavior: "smooth", block: "start" });
        card?.querySelector("input")?.focus({ preventScroll: true });
    }
    if (action === "handoff")
        downloadFile(L("CONTEXTO-PARA-CONTINUAR.txt", "HANDOFF-EN.txt"), GUIDE_HANDOFF, "text/plain;charset=utf-8");
    if (action === "expand-tree")
        showExpandedTree();
    if (action === "close-tree") {
        document.getElementById("tree-preview").close();
        document.getElementById("tree-preview").innerHTML = "";
    }
    if (action === "show-plan")
        document
            .getElementById("assembly-summary")
            .scrollIntoView({ behavior: "smooth", block: "start" });
    if (action === "export-plan")
        downloadFile(L("meu-roteiro-montagem-opencore.html", "my-opencore-build-outline.html"), exportAssemblyDocument(), "text/html;charset=utf-8");
    if (action === "review-plan") {
        if (confirm(L("Voc\u00EA revisou suas escolhas para o invent\u00E1rio atual? Isso registra apenas sua revis\u00E3o, n\u00E3o confirma suporte nem testa a EFI.", "Have you reviewed your choices for the current inventory? This records only your review, not support confirmation or an EFI test."))) {
            state.plan.reviewedAgainst = assemblyFingerprint(state.profile);
            state.plan.checks = {};
            save();
            refreshAssemblyView();
            toast(L("Revis\u00E3o registrada. Refa\u00E7a as confer\u00EAncias afetadas antes de testar.", "Review recorded. Repeat affected checks before testing."));
        }
    }
    if (action === "add-plan-aml") {
        const name = document.getElementById("plan-aml-name").value.trim();
        if (!validAmlName(name)) {
            toast(L("Use somente um nome .aml v\u00E1lido, sem pastas. N\u00E3o inclua DSDT completo.", "Use only a valid .aml filename without folders. Do not include the full DSDT."));
            return;
        }
        if (state.plan.amls.some((old) => old.toLowerCase() === name.toLowerCase())) {
            toast(L("Esse AML j\u00E1 est\u00E1 no plano.", "This AML is already in the plan."));
            return;
        }
        if (state.plan.amls.length >= 40) {
            toast(L("O limite \u00E9 40 nomes de AML. Revise se todos s\u00E3o necess\u00E1rios.", "The limit is 40 AML names. Review whether all are necessary."));
            return;
        }
        state.plan.amls.push(name);
        if (!state.plan.reviewedAgainst)
            state.plan.reviewedAgainst = assemblyFingerprint(state.profile);
        for (const key of ["acpi", "snapshot", "settings", "validate"])
            delete state.plan.checks[key];
        save();
        refreshAssemblyView("#plan-aml-name");
        toast(L("Nome adicionado ao plano. O conte\u00FAdo do AML n\u00E3o foi lido nem validado.", "Name added to the plan. AML content was not read or validated."));
    }
    if (action === "import-hardware")
        document.getElementById("hardware-file").click();
    if (action === "show-hardware-help") {
        const help = document.getElementById("hardware-instructions");
        help.open = true;
        help.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    if (action === "cancel-hardware")
        closeHardwarePreview();
    if (action?.startsWith("hardware-select-"))
        selectHardwareFields(action.slice("hardware-select-".length));
    if (action === "apply-hardware" && pendingHardwareReport) {
        const selected = [
            ...document.querySelectorAll("[data-hardware-field]:checked"),
        ].map((input) => input.dataset.hardwareField);
        const merged = mergeHardwareSelection(state.profile, state.origins, pendingHardwareReport.proposals, selected);
        if (merged.applied.length) {
            if (merged.profile.gpu !== state.profile.gpu) {
                merged.profile.displayGpu = "";
                merged.profile.displayConnection = "unknown";
            }
            state.profile = merged.profile;
            state.origins = merged.origins;
            closeHardwarePreview();
            save();
            navigate("profile");
            toast(L.format("{{0}} campos importados. Revise as infer\u00EAncias e continue editando normalmente.", "{{0}} fields imported. Review inferences and continue editing normally.", [merged.applied.length]));
        }
    }
    if (action === "menu")
        document.getElementById("sidebar").classList.toggle("mobile-open");
    if (action === "search") {
        query = "";
        groupFilter = "all";
        taskFilter = "all";
        navigate("journey");
        document.getElementById("guide-search").focus();
    }
    if (action === "start-route") {
        navigate("preparation");
    }
    if (action === "download") {
        downloadFile("GUIA-INTERATIVO-OPENCORE.html", pristineDocument, "text/html;charset=utf-8");
        toast(L("HTML p\u00FAblico preparado. Perfil e progresso n\u00E3o est\u00E3o inclu\u00EDdos.", "Public HTML prepared. Profile and progress are not included."));
    }
    if (action === "export") {
        downloadFile(L("meu-projeto-opencore.json", "my-opencore-project.json"), JSON.stringify({ ...state, exportedAt: new Date().toISOString(), edition: VERSION }, null, 2), "application/json");
        toast(L("Backup preparado. Revise as notas antes de compartilhar.", "Backup prepared. Review notes before sharing."));
    }
    if (action === "import")
        document.getElementById("import-file").click();
    if (action === "report")
        downloadFile(L("relatorio-opencore.html", "opencore-report.html"), report(), "text/html;charset=utf-8");
    if (action === "print") {
        document.getElementById("printonly").innerHTML = report()
            .replace(/^.*?<h1>/s, "<h1>")
            .replace(/<\/html>$/, "");
        window.print();
    }
    if (action === "reset" &&
        confirm(L("Apagar perfil, notas e marca\u00E7\u00F5es locais? Exporte um backup antes se quiser preservar os dados.", "Delete the local profile, notes and checks? Export a backup first if you want to preserve them."))) {
        state = freshState();
        save();
        navigate("overview");
        toast(L("Projeto local reiniciado.", "Local project reset."));
    }
    if (action === "expand")
        document.querySelectorAll("details.chapter").forEach((d) => (d.open = true));
    if (action === "collapse")
        document
            .querySelectorAll("details.chapter")
            .forEach((d) => (d.open = false));
    if (action === "clear-filters") {
        query = "";
        taskFilter = "all";
        groupFilter = "all";
        renderMain();
    }
});
guideListen("input", (e) => {
    const el = e.target;
    if (el.dataset.testEvidence &&
        adaptiveTestCatalog.some((item) => item.id === el.dataset.testEvidence)) {
        const id = el.dataset.testEvidence;
        if (!state.testResults[id])
            state.testResults[id] = { status: "untested", evidence: "", against: "" };
        state.testResults[id].evidence = el.value.slice(0, 2000);
        save();
    }
    if (el.dataset.versionId &&
        (el.dataset.versionId === "opencore" ||
            assemblyCatalog.some((item) => item.id === el.dataset.versionId)) &&
        ["version", "source", "revision"].includes(el.dataset.versionField)) {
        const id = el.dataset.versionId;
        if (!state.versions[id])
            state.versions[id] = {};
        state.versions[id][el.dataset.versionField] = el.value.slice(0, 500);
        save();
        updateReviewPanel("adaptive-tests", adaptiveTestsHtml);
    }
    if (el.dataset.acpiSearch) {
        const catalog = el.closest(".acpi-catalog");
        if (catalog)
            catalog.querySelector(".acpi-results").innerHTML = acpiCatalogRows(el.value);
    }
    if (el.dataset.profile && el.tagName !== "SELECT") {
        state.profile[el.dataset.profile] = el.value;
        if (el.dataset.profile === "gpu") {
            state.profile.displayGpu = "";
            state.profile.displayConnection = "unknown";
            updateReviewPanel("gpu-selection", gpuSelectionHtml);
        }
        delete state.origins[el.dataset.profile];
        const originLabel = document.getElementById("origin-" + el.dataset.profile);
        if (originLabel)
            originLabel.textContent = "";
        save();
        updateProfileWarning();
        updateMacOSAssessment();
        const issue = document.getElementById("target-version-issue");
        if (issue)
            issue.textContent =
                targetVersionIssue(state.profile) || L("Registre os n\u00FAmeros conferidos no sistema ou instalador. N\u00E3o s\u00E3o inferidos do Hardware Report.", "Record numbers verified in the OS or installer. They are not inferred from the Hardware Report.");
        updateReviewPanel("adaptive-tests", adaptiveTestsHtml);
    }
    if (el.dataset.note) {
        state.notes[el.dataset.note] = el.value;
        save();
    }
    if (el.id === "guide-search") {
        query = el.value;
        let list = activeChapters();
        if (view === "diagnostics")
            list = list.filter((c) => [
                "validar",
                "boot",
                "pos",
                "estabilidade",
                "diagnostico",
                "usb",
            ].includes(c.id));
        else if (groupFilter !== "all")
            list = list.filter((c) => c.group === groupFilter);
        document.getElementById("chapter-list").innerHTML = renderChapterList(list);
    }
});
guideListen("change", async (e) => {
    const el = e.target;
    if (el.dataset.testStatus &&
        adaptiveTestCatalog.some((item) => item.id === el.dataset.testStatus) &&
        Object.hasOwn(testStatuses, el.value)) {
        const id = el.dataset.testStatus;
        state.testResults[id] = {
            status: el.value,
            evidence: state.testResults[id]?.evidence || "",
            against: testContextFingerprint(state.profile, state.plan, state.versions),
        };
        save();
        updateReviewPanel("adaptive-tests", adaptiveTestsHtml);
        return;
    }
    if (el.dataset.planItem) {
        changePlanComponent(el.dataset.planItem, el.checked);
        return;
    }
    if (el.dataset.planCheck) {
        if (getAssemblyPlan(state.profile, state.plan).stale) {
            el.checked = false;
            toast(L("Revise as escolhas para o invent\u00E1rio atual antes de registrar novas confer\u00EAncias.", "Review choices for the current inventory before recording new checks."));
            return;
        }
        if (!state.plan.reviewedAgainst)
            state.plan.reviewedAgainst = assemblyFingerprint(state.profile);
        if (el.checked)
            state.plan.checks[el.dataset.planCheck] = true;
        else
            delete state.plan.checks[el.dataset.planCheck];
        save();
        return;
    }
    if (el.dataset.hardwareField)
        updateHardwareSelectionCount();
    if (el.dataset.task) {
        const id = el.dataset.task;
        if (el.checked)
            state.tasks[id] = "done";
        else
            delete state.tasks[id];
        el.closest(".task-row").classList.toggle("done", el.checked);
        save();
    }
    if (el.id === "task-filter") {
        taskFilter = el.value;
        renderMain();
    }
    if (el.dataset.profile && el.tagName === "SELECT") {
        state.profile[el.dataset.profile] = el.value;
        if (el.dataset.profile === "displayGpu")
            state.profile.displayConnection = "unknown";
        if (!state.profile.displayGpu)
            state.profile.displayConnection = "unknown";
        delete state.origins[el.dataset.profile];
        save();
        renderMain();
    }
    if (el.id === "import-file" && el.files[0]) {
        fileReads++;
        try {
            if (el.files[0].size > 1000000)
                throw Error(L("Backup muito grande. O limite \u00E9 1 MB.", "Backup too large. The limit is 1 MB."));
            const incoming = cleanState(JSON.parse(await el.files[0].text()));
            if (confirm(L("Substituir o projeto local pelo backup selecionado?", "Replace the local project with the selected backup?"))) {
                state = incoming;
                save();
                navigate("overview");
                toast(L("Backup importado. Perfil, notas e marca\u00E7\u00F5es restaurados.", "Backup imported. Profile, notes and checks restored."));
            }
        }
        catch (error) {
            toast(error.message || L("N\u00E3o foi poss\u00EDvel importar este arquivo.", "Could not import this file."));
        }
        finally {
            fileReads--;
            el.value = "";
        }
    }
    if (el.id === "hardware-file" && el.files[0]) {
        fileReads++;
        try {
            if (el.files[0].size > 2000000)
                throw Error(L("Relat\u00F3rio muito grande. O limite \u00E9 2 MB; selecione somente o Hardware Report JSON.", "Report too large. The limit is 2 MB; select only the Hardware Report JSON."));
            const text = (await el.files[0].text()).replace(/^\uFEFF/, "");
            let json;
            try {
                json = JSON.parse(text);
            }
            catch {
                throw Error(L("JSON inv\u00E1lido. Selecione o arquivo de Export Hardware Report, n\u00E3o uma tabela ACPI ou arquivo compactado.", "Invalid JSON. Select the Export Hardware Report file, not an ACPI table or archive."));
            }
            const parsed = parseHardwareReport(json);
            showHardwarePreview(parsed);
        }
        catch (error) {
            toast(error.message || L("N\u00E3o foi poss\u00EDvel ler o relat\u00F3rio. Use o JSON do Export Hardware Report.", "Could not read the report. Use the Export Hardware Report JSON."));
        }
        finally {
            fileReads--;
            el.value = "";
        }
    }
});
guideListen("cancel", (e) => {
    if (e.target.id === "hardware-preview") {
        pendingHardwareReport = null;
        e.target.innerHTML = "";
    }
    if (e.target.id === "tree-preview")
        e.target.innerHTML = "";
}, true);
guideListen("keydown", (e) => {
    if (document.getElementById("hardware-preview").open ||
        document.getElementById("tree-preview").open)
        return;
    if (e.key === "/" &&
        !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        groupFilter = "all";
        navigate("journey");
        document.getElementById("guide-search").focus();
    }
    if (e.key === "Escape")
        document.getElementById("sidebar").classList.remove("mobile-open");
});
shell();
if (!storageAvailable)
    toast(L("Armazenamento local indispon\u00EDvel. Use exportar backup para preservar seu projeto.", "Local storage unavailable. Export a backup to preserve your project."));

  if (initialState) {
    state = initialState
    view = initialUI.view || "overview"
    groupFilter = initialUI.groupFilter || "all"
    query = initialUI.query || ""
    taskFilter = initialUI.taskFilter || "all"
    kextFilter = initialUI.kextFilter || "all"
    activeChapter = initialUI.activeChapter || null
    activeExample = initialUI.activeExample || null
    lastPrimaryView = initialUI.lastPrimaryView || "profile"
    renderMain()
    const sections = document.querySelectorAll("details")
    for (const item of initialUI.details || []) {
      const section = item.id ? document.getElementById(item.id) : sections.length === initialUI.detailCount ? sections[item.index] : null
      if (section instanceof HTMLDetailsElement) section.open = item.open
    }
    window.scrollTo({ top: initialUI.scroll || 0, behavior: "instant" })
    document.querySelector('[data-action="language"]')?.focus({ preventScroll: true })
  }
  guideSession = {
    stop: () => { lifecycle.abort(); clearTimeout(toast.timer) },
    snapshot: () => state,
    report: () => report(),
    outline: () => exportAssemblyDocument(),
    publicHTML: pristineDocument,
    handoff: GUIDE_HANDOFF,
  }
  // GUIDE_RUNTIME_READY
}
startGuide()
</script></body></html>
