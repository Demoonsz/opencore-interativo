.side-progress{background:#252a35;border-color:#394153}

<script>const GUIDE_HANDOFF_PT = "# Contexto para continuar o OpenCore Interativo\n\n## O que é o projeto\n\nEstamos construindo uma ferramenta pública, originalmente em português e também disponível em inglês, para orientar um Hackintosh com OpenCore. O objetivo é ensinar o método e ajudar o usuário a organizar as próprias decisões. Não é um gerador de EFI, não baixa binários automaticamente e não certifica hardware.\n\nO formato principal e único do guia público é um HTML interativo autônomo, que funciona offline. Links para documentação e projetos exigem internet. Versões antigas de guia pessoal, Markdown, TXT e ZIP existem como histórico no repositório, mas não devem voltar à navegação principal.\n\nO projeto nasceu de um estudo de uma máquina Xeon/X99, mas foi generalizado. Não transforme novamente o conteúdo em tutorial exclusivo daquela máquina. Os exemplos são cenários hipotéticos, não configurações universalmente testadas.\n\n## Aparência e autoria\n\n- Tema grafite/cinza-escuro com detalhes azul-acinzentados.\n- Azul principal: #5267a5; foco azul-claro: #93aaf0.\n- Não voltar ao verde ou ao contorno amarelado.\n- Marca superior: OpenCore / Guia Interativo.\n- Edição atual: 3.2, mantida na constante VERSION.\n- Edição e assinatura discreta “Feito por Gustavo Oliveira” ficam no rodapé, não como destaque superior.\n- Preservar fontes, licenças e a declaração de que o guia não é afiliado ao Dortania ou à Acidanthera.\n\n## Um único caminho principal\n\nA estrutura foi simplificada após várias revisões porque o excesso de mapas e menus estava confundindo iniciantes.\n\n1. Meu hardware: importar relatório ou preencher e revisar manualmente.\n2. Preparar BIOS e ACPI: backup, BIOS, reinício, dump e SSDTs.\n3. Montar EFI: planejador guiado pelo inventário, com escolha de componentes e estrutura de pastas.\n4. Instalar e testar: ocvalidate, instalador, boot, pós-instalação e testes.\n\nComeçar explica esse mesmo caminho. Não recriar uma segunda “jornada”, um mapa paralelo de seis fases ou outro resumo competindo com a execução.\n\nConsulta e ajuda é recolhível na lateral e contém a biblioteca completa, kexts, diagnóstico, fontes e glossário. Artigos de consulta indicam que são apoio e oferecem retorno à etapa anterior. Meu projeto e backups fica separado das quatro etapas.\n\n## Meu hardware e importação\n\nO preenchimento manual foi preservado. O usuário também pode importar o JSON de Export Hardware Report do Hardware Sniffer.\n\n- Dump ACPI Tables não é necessário nem aceito para preencher o inventário.\n- O JSON é lido localmente no navegador; não há upload a servidor.\n- O formato implementado foi conferido com um relatório real, mas esse arquivo privado não foi incorporado ao guia nem às fixtures.\n- O parser usa uma lista explícita de campos técnicos permitidos.\n- Campos existentes começam desmarcados na prévia para não serem sobrescritos sem escolha.\n- A prévia distingue dado reportado de inferência de plataforma/família.\n- Somente os campos selecionados são aplicados; depois continuam editáveis.\n- Prévia com Marcar todos, Desmarcar todos e Somente campos vazios. Marcar todos inclui substituições/inferências com aviso; nenhum desses botões aplica dados. Vazio inclui texto só com espaços e enum unknown; valores none são preservados pela opção de vazios.\n- Edição manual remove a marcação de origem importada.\n- macOS alvo, OpenCore, SMBIOS, CPUID, layout, framebuffer e quirks não são derivados automaticamente do relatório.\n- Ausência no relatório não significa ausência de hardware.\n- Memória RAM possui campo manual: não inventar capacidade quando o relatório não contém esse dado.\n- Áudio integrado, USB e áudio da GPU podem coexistir; não escolher automaticamente qual o usuário utiliza.\n- O nome de um controlador de armazenamento pode divergir do nome/capacidade do disco. Preservar as descrições e avisar para conferir.\n- Relatório de hardware e backup JSON do guia têm botões, schemas e propósitos distintos.\n\n## Recomendações de kexts\n\nSão candidatos para pesquisa, não uma lista de instalação garantida.\n\n- Indicam motivo, verificações e fonte oficial.\n- Nomes vagos ou dados conflitantes ficam pendentes.\n- Não recomendar IntelMausi para toda Ethernet Intel; I225/I226 não são inferidos como IntelMausi.\n- Distinguir RTL8111/8168 de RTL8125.\n- Wi-Fi Intel não implica automaticamente Bluetooth Intel.\n- Não usar itlwm e AirportItlwm juntos; build e estratégia dependem do macOS.\n- NVMeFix e CpuTscSync não são exigências universais.\n- Não inventar layout de áudio.\n\n## Montar EFI: parte central a preservar\n\nO usuário gostou especialmente desta funcionalidade.\n\n- Mostra o inventário usado: CPU, geração, memória, GPU, áudio, rede, Bluetooth e armazenamento.\n- Oferece componentes com caixas de seleção e explica por que considerar, onde obter e onde copiar.\n- As escolhas são manuais. Dependências do catálogo entram no plano com aviso.\n- Retirar um framework pede confirmação antes de retirar dependentes.\n- Alternativas de Wi-Fi e de mapa USB são mutuamente exclusivas.\n- O painel do plano mostra escolhas, fontes, árvore e alertas.\n- Há instruções práticas para separar a base, copiar pacotes completos, criar config.plist a partir de Sample.plist, integrar patches, usar Snapshot e revisar a plataforma.\n- Subetapa 3.3 explicita SSDTs, compilação, cópia, ACPI/Add e patches associados; preserva o catálogo e o registro manual de AMLs.\n- Subetapa 3.5 contém leituras recolhíveis de config.plist, SMBIOS e USB, renderizadas dos mesmos capítulos da consulta (sem duplicar textos ou IDs de tarefas). Modelo SMBIOS continua sendo editado no perfil, sem coletar identidades.\n- O plano não lê nem valida arquivos do disco.\n- Só registra nomes de AMLs gerados e revisados pelo usuário; não gera SSDTs.\n- Nomes de AML são validados; rejeitar caminhos, HTML e DSDT completo.\n- Alterar hardware/macOS preserva escolhas, mas exige revisão e invalida conferências afetadas.\n- O plano base demonstrado é UEFI x64; não tratá-lo como preset universal para IA32 ou hardware legado.\n- O roteiro de montagem pode ser exportado como HTML somente de leitura.\n- O backup JSON guarda o plano editável.\n- O download do HTML público não incorpora perfil, notas, escolhas ou relatório do usuário.\n\n## ACPI / SSDTs\n\nHá uma consulta ampliada com 21 tópicos, acessível na preparação e na subetapa ACPI da montagem, sem criar nova etapa principal.\n\nInclui EC, EC-USBX, USBX, PLUG, CPU-PM Sandy/Ivy, HPET, AWAC, RTC0, RTC0-RANGE, UNC, PMC, RHUB/USB-Reset, PNLF, GPI0, XOSI, SBUS-MCHC, IMEI, Bridge, DMAR, CPUR e desativação de dGPU.\n\nNão chamar isso de lista de todos os SSDTs existentes. Há correções personalizadas. Nem toda correção ACPI é SSDT: DMAR é uma tabela distinta.\n\nCada tópico possui finalidade, condições, cuidados, método e fontes. Não há botão “instalar todos”, nem inclusão automática de AMLs a partir do catálogo.\n\nPontos importantes conferidos nas fontes:\n\n- BIOS deve ser configurada e salva antes do dump ACPI definitivo.\n- Não copiar o DSDT completo como solução genérica.\n- AML e renames/patches podem formar um conjunto.\n- RTC em HEDT tem método próprio; não assumir que RTCAWAC genérico resolve RTC0-RANGE.\n- A página de energia do Dortania observa que SSDT-PLUG não é exigido no macOS 12.3+; não converter isso em remoção automática de uma EFI estável.\n- GPIO pode já estar habilitado; XOSI não é obrigatório em todo notebook.\n- PMC é para chipsets específicos e não uma solução universal de NVRAM.\n- CPUR não é para todo AMD.\n- O mapa USB é separado de USBX e USB Reset.\n\n## Visualização da estrutura\n\nA árvore da EFI deve caber sem rolagem horizontal. O painel foi alargado, usa quebra de linha para nomes longos e possui leitura ampliada. Não esconder conteúdo lateralmente nem depender de arrastar um lado para ver o outro.\n\n## Detalhamento BIOS, SMBIOS e USB (2.7)\n\n- BIOS: orientações condicionais de habilitar/desabilitar, CFG Lock por geração, VT-d/DMAR, Above 4G versus Re-Size BAR, DVMT, HEDT, notebook e AMD; link da plataforma atual e referências específicas. Preservar ressalvas de AHCI, BitLocker/TPM e recuperação. Não é preset.\n- SMBIOS: distingue iMac7,1, iMacPro1,1 e MacPro7,1; ensina critérios, SystemProductName e correspondência dos campos privados gerados externamente. Sem serial de exemplo, seleção automática ou promessa de suporte.\n- USB: diferencia HS/SS e conector físico, limite por controlador, 5 Gb/s (não “USB 5.0”), tipos, internos e USB-C, descoberta no Windows, alternativa USBMap, integração do mapa e teste.\n- XhciPortLimit fica em Kernel/Quirks, não na BIOS. Orientação histórica de True temporário deve ser lida junto às ressalvas de macOS 11.3+ e à documentação da versão do OpenCore. Não declarar que todo OpenCore moderno é incapaz de aplicar o quirk; o objetivo é mapa final com False, sem usar contorno como solução universal.\n\n## Dados e segurança\n\n- Sem backend, conta ou telemetria: armazenamento local com localStorage.\n- Chave persistente: guia-opencore-publico-v2.\n- Schema dos backups: 2.\n- Não mudar essa chave ou quebrar backups existentes sem migração.\n- Estado inclui profile, tasks, notes, origins, plan, maturity, testResults e versions.\n- Marcações e maturidade são declarações do usuário, não testes automáticos.\n- Importação valida tipos, enums, limites e IDs conhecidos.\n- Escapar dados antes de inserir em HTML. Relatórios e notas podem conter texto malicioso.\n- Nunca solicitar ou publicar serial, MLB, SystemUUID, ROM, Apple ID, senhas ou chaves de recuperação.\n- O JSON bruto de hardware não é persistido.\n\n## Fontes e licenças\n\nBase metodológica: Dortania OpenCore Install Guide, Getting Started With ACPI e OpenCore Post-Install.\n\nComportamento do bootloader: Configuration.pdf da versão usada do OpenCore e release notes.\n\nKexts/ferramentas: repositórios e documentação dos próprios projetos.\n\nOpCore Simplify é ferramenta independente, não um método oficial do Dortania. Deve ser tratado como bônus auditável, não promessa de compatibilidade.\n\nOs links comunitários de Gabriel Luchina foram removidos das fontes públicas a pedido do usuário na edição 2.8. Não reintroduzir esses links. Nenhum arquivo, script, EFI ou texto próprio desses repositórios foi incorporado. Preservar o respeito às licenças e a redação independente fundamentada nas fontes primárias.\n\n## Áudio e Wi-Fi por versão (2.8)\n\n- Consultas Áudio, Rede e Wi-Fi Intel ampliadas, sem uma quinta etapa e sem mudar IDs de tarefas.\n- Fonte principal de Tahoe: https://dortania.github.io/OpenCore-Install-Guide/extras/tahoe.html.\n- Tahoe 26 não contém AppleHDA; AppleALC sozinho não habilita áudio analógico. USB/HDMI/DP têm caminhos distintos. VoodooHDA e restauração de AppleHDA têm requisitos/custos, não são seleção automática nem instrução universal para reduzir proteções.\n- AirportItlwm v2.3.0 oficial distingue Sonoma 14.0–14.3 de 14.4+. A release consultada não oferece asset para Sequoia/Tahoe. Não extrapolar essa ausência para todo desenvolvimento futuro; forks exigem autor/tag/commit e build identificados.\n- AppleBCMWLANCompanion, de FireWolf, aparece como consulta experimental, não seleção automática no catálogo. README consultado (atualização declarada 21/11/2025) limita chips a BCM43602 e BCM4350 e enumera builds de Sequoia/Tahoe; Sonoma 14.8 está não verificado.\n- Distinguir o caminho VT-d/AppleVTD descrito pelo Dortania da alternativa sem IOMapper documentada no manual BCMC 1.1.0, com custos de memória/desempenho. Não declarar suporte AMD sem evidência.\n- O projeto exige firmware/hash, propriedades PCI, argumento de boot, Lilu e sistema sem antigos root patches de Wi-Fi. Sem root patches não significa sem configuração.\n- Não afirmar que este projeto é a kext modificada lembrada pelo usuário: falta identificar nome/autor/link.\n- Recomendações e alertas de montagem respondem ao macOS escolhido, preservando escolhas antigas e backups schema 2. Nenhum binário, patch de sistema, alcid ou ajuste de segurança é gerado/aplicado.\n\nNão afirmar testes de estabilidade em plataformas que não foram realmente testadas.\n\n## Complementos essenciais e triagem de macOS (2.9)\n\n- `macos-assessment.js` faz triagem local conservadora na etapa Meu hardware, após aplicar o relatório e ao editar. Não escolhe macOS, não modifica perfil, não persiste avaliação derivada nem gera EFI.\n- Faixas candidatas são apenas CPU/GPU. Rede, áudio, firmware, armazenamento, SMBIOS e testes permanecem pendentes. Não chamar isso de certificação da máquina ou previsão de “roda bem”.\n- Modelos não reconhecidos, variantes conflitantes, múltiplas GPUs, AMD e gerações fora das regras não recebem faixa automática. Tabelas de GPU consultadas em 05/11/2026 têm escopo até Sequoia; isso não é prova de incompatibilidade com Tahoe.\n- RAM é manual; ausente não é inferida. Atenção à multitarefa com pouca RAM é orientação editorial, não benchmark nem teto por macOS.\n- Conteúdo acrescido foi limitado a SSDs com alertas por modelo, WhateverGreen/Tahoe, microfone Intel SST, rede no Recovery, diagnóstico por estágio, teste NVRAM e arquivos coordenados em atualizações.\n- Teste NVRAM não distingue persistência nativa de emulada; não copiar receita histórica de emulação sem documentação da versão usada.\n- Preservar schema 2, chave, IDs, assinatura e as quatro etapas. Testar também `node --test guide/tests/macos-assessment.test.cjs` e `node --check guide/macos-assessment.js`.\n\n## Revisão por componente e registros locais (3.0)\n\n- Preservar “Qual macOS considerar?” sem comentários de fluidez, lentidão ou pressão de RAM. A versão 3.0 substitui a orientação editorial de recursos da 2.9.\n- `profile.displayGpu` é uma escolha manual dentre `gpuChoices(profile)`. Em múltiplas GPUs, `displayConnection: \"confirmed\"` é necessário para usar a seleção na triagem. Alterar o inventário reinicia essa declaração. Nunca desativar outras GPUs automaticamente.\n- `profile.macosVersion` e `profile.macosBuild` são campos manuais, não importados do Hardware Report. Divergências e mínimos conhecidos são apresentados sem trocar o macOS alvo.\n- `project-review.js` reúne a revisão conservadora por componente, testes adaptados, normalização de registros e identificador de contexto.\n- Estado schema 2 recebe `testResults` e `versions` opcionais. Backups antigos recebem objetos vazios. Não trocar a chave do localStorage.\n- Testes adaptados são independentes das tarefas históricas: Não testado, Verificado, Com problema ou Não utilizado, com evidência. Ficam na etapa 4 e no caderno. Dados desconhecidos não são tratados como ausência. Registros fora do perfil são preservados.\n- Contexto de testes inclui hardware, alvo/build, GPU declarada, SMBIOS, plano e versões registradas; mudanças pedem revisão, sem apagar resultado/evidência. Só declaração explícita reconfirma; editar evidência não basta. Identificador compacto não é assinatura de segurança.\n- Manifesto registra versão, origem e tag/commit/variante por componente do catálogo. OpenCore usa `profile.oc` como única versão canônica. Retirar um componente não apaga o registro.\n- Novos campos são validados e escapados em telas e relatórios. Registro de procedência não verifica binários/URLs. Sem downloads automáticos ou backend.\n- Relatório HTML e backup incluem os registros; HTML público continua limpo. Testar `guide/tests/project-review.test.cjs` além dos testes anteriores.\n\n## SMBIOS, USB/X99 e CPU/Xeon (3.1)\n\n- `smbiosModelCatalog` e `smbiosModelReview` ficam em macos-assessment.js. Comparam poucos modelos, não escolhem SMBIOS. Os cards são reutilizados em Consulta e Montagem por chapterReading/smbiosComparisonHtml.\n- iMacPro1,1: High Sierra 10.13.2/build inicial 17C2111 até Sequoia 15; não consta na lista nativa de Tahoe. MacPro7,1: Catalina 10.15 até Tahoe no escopo conferido, não High Sierra/Mojave. Confirmar builds iniciais. Modelos iMac19,1 e iMac20,1 dão exemplos de Intel desktop, não presets.\n- A lista geral do Dortania ainda mostra Current em alguns modelos; para Sequoia/Tahoe foram usadas também as listas específicas Apple 120282/122867. Não converter suporte do modelo Apple em compatibilidade do PC nem inferir suporte posterior a Tahoe.\n- O resumo BIOS/SMBIOS identifica seleção fora da faixa do alvo, sem modificar o perfil; modelos fora da comparação curta continuam pendentes.\n- XhciPortLimit é Kernel/Quirks (Boolean), não kext, BIOS, mapa ou habilitação de SuperSpeed. A sequência X99 usa identificação de controladores e mapa próprio. Atalho na montagem abre opções já existentes: USBToolBox/UTBMap ou USBMap, sem escolher por conta própria.\n- Changelog documenta melhorias do quirk em OC 0.9.3 (11–14) e 1.0.7 (Tahoe). Não afirmar que toda versão moderna é incapaz de aplicá-lo; Configuration.pdf ainda recomenda evitar o contorno e limitar portas. Mapa final com False.\n- CPU/Xeon detalha caminhos Emulate, ExtraMsrs, CFG Lock, verificação de X86PlatformPlugin e clocks. ForceBoost força multiplicador máximo em XCPM e é desencorajado para uso geral; não é o Turbo Boost normal. CPUFriend exige necessidade e dados próprios. Sem desbloqueio de turbo, microcódigo removido, firmware modificado, CPUID ou multiplicadores universais.\n- Leitura CPU acessível na montagem 3.5; tarefas antigas e backups continuam preservados.\n\n## Português e inglês (3.2)\n\n- Os dois idiomas ficam incorporados no mesmo HTML offline. O botão do cabeçalho troca sem serviços externos.\n- A preferência independente usa `opencore-interativo-language-v1`; o padrão é português. A troca também deve funcionar em memória com armazenamento bloqueado.\n- `guide/i18n/compile.cjs` usa o parser TypeScript já instalado para localizar somente textos literais. Traduções com chaves hash ficam em `guide/i18n/en/`; identidades técnicas/inglesas revisadas ficam em `identity.json`. Não traduzir entradas do usuário, chaves de schema, IDs, comandos, caminhos ou URLs.\n- Ao trocar idioma, reinicializar estruturas de apresentação em runtime isolado, abortar ouvintes antigos e preservar projeto, view atual e seções abertas.\n- Manter um único snapshot limpo do documento público, capturado antes da renderização. Não recapturar HTML preenchido ao trocar idioma.\n- Interface, capítulos, catálogos, triagens, diálogos, mensagens, relatório HTML, roteiro e resumo de continuidade são localizados. Notas e procedência digitadas são preservadas literalmente.\n- Testar conteúdo inglês, interpolação, identificadores técnicos, privacidade, busca, importação/exportação, preservação de estado e trocas repetidas em desktop/celular.\n\n## Se você recebeu somente o HTML\n\nPreserve uma cópia integral antes de editar. O arquivo contém CSS, dados e código JavaScript incorporados. Não remova funcionalidades por reconstruir apenas o visual.\n\nProcure as constantes VERSION e STORAGE, os catálogos, o parser do relatório e as funções de navegação/montagem. Preserve os IDs de tarefas e componentes e o schema 2.\n\nValide o HTML offline e os fluxos reais no navegador: importar/cancelar/aplicar, editar campos, escolher componentes, dependências, alternativas, alertas de mudança de perfil, salvar/restaurar e baixar cópia pública sem dados privados.\n\n## Se você recebeu o repositório\n\n- src/App.tsx exibe o HTML em um iframe.\n- O arquivo público é public/downloads/GUIA-INTERATIVO-OPENCORE.html.\n- Fontes mantidos em guide/: content.js, acpi-catalog.js, recommendations.js, macos-assessment.js, project-review.js, hardware-import.js, assembly.js, assembly-ui.js, navigation.js, app.js, i18n.js, i18n/ e style.css.\n- guide/build.py regenera o HTML autônomo. Preferir editar esses fontes e regenerar, não fazer correções isoladas só no arquivo gerado.\n- guide/tests contém testes Node, com fixtures sintéticas.\n- Ler AGENTS.md antes de trabalhar.\n- O servidor da prévia é supervisionado; não iniciar outro servidor de desenvolvimento.\n- Não adicionar backend ou dependências desnecessárias para funcionalidades locais.\n\nComandos principais:\n\n    python guide/build.py\n    node --test guide/tests/*.test.cjs\n    node --check guide/app.js\n    pnpm run format --check guide/app.js guide/acpi-catalog.js guide/assembly-ui.js\n    pnpm exec tsc --noEmit\n    pnpm run build\n\nAlém do build, testar interações em desktop e celular e conferir que o HTML da saída de produção corresponde ao arquivo público.\n"
const GUIDE_HANDOFF_EN = "# Context for continuing OpenCore Interativo\n\n## What this project is\n\nWe are building a public guide, originally written in Portuguese, for using OpenCore on a Hackintosh. Its purpose is to teach the method and help users organize their own decisions. It is not an EFI generator, does not automatically download binaries and does not certify hardware.\n\nThe public guide's only main format is a self-contained interactive HTML that works offline. Documentation and project links need internet access. Old personal-guide, Markdown, TXT and ZIP versions remain in the repository as history and must not return to the main navigation.\n\nThe project started with a Xeon/X99 machine study but was generalized. Do not turn it back into a machine-specific tutorial. Examples are hypothetical scenarios, not universally tested configurations.\n\n## Appearance and authorship\n\n- Graphite/dark-gray theme with blue-gray accents.\n- Main blue: #5267a5; light-blue focus: #93aaf0.\n- Do not return to green or yellowish outlines.\n- Header brand: OpenCore / Interactive Guide (Guia Interativo in Portuguese).\n- Current edition: 3.2, maintained in VERSION.\n- Edition and the discreet “Made by Gustavo Oliveira” signature remain in the footer, not as a prominent top badge.\n- Preserve sources, licenses and the statement that the guide is not affiliated with Dortania or Acidanthera.\n\n## One main workflow\n\nThe structure was simplified after several revisions because competing maps and menus confused beginners.\n\n1. My hardware: import a report or enter and review details manually.\n2. Prepare BIOS and ACPI: backup, BIOS, restart, dump and SSDTs.\n3. Build EFI: inventory-based planner with component choices and folder structure.\n4. Install and test: ocvalidate, installer, boot, post-installation and tests.\n\nStart explains this same workflow. Do not recreate a second journey, a parallel six-phase map or another summary competing with execution.\n\nReference and help is collapsible in the sidebar and contains the complete library, kexts, diagnosis, sources and glossary. Reference articles identify themselves as support and provide a return to the previous step. My project and backups is separate from the four steps.\n\n## My hardware and import\n\nManual entry is preserved. Users can also import Hardware Sniffer's Export Hardware Report JSON.\n\n- Dump ACPI Tables is neither necessary nor accepted to fill the inventory.\n- JSON is read locally in the browser; it is not uploaded to a server.\n- The implemented format was checked against a real report, but that private file is not included in the guide or fixtures.\n- The parser uses an explicit allowlist of technical fields.\n- Existing fields start unchecked in the preview so replacement requires a choice.\n- The preview distinguishes reported data from platform/family inferences.\n- Only selected fields are applied; they remain editable.\n- Preview offers Select all, Deselect all and Empty fields only. Select all includes replacements/inferences with a warning; none of these buttons applies data. Empty includes whitespace-only strings and the unknown enum; none values are preserved by Empty fields only.\n- Manual editing removes imported-origin labeling.\n- Target macOS, OpenCore, SMBIOS, CPUID, layout, framebuffer and quirks are not automatically derived from the report.\n- Missing data does not mean absent hardware.\n- RAM has a manual field: never invent capacity absent from the report.\n- Integrated, USB and GPU audio may coexist; do not automatically decide which the user uses.\n- A storage controller's name may differ from the drive's name/capacity. Preserve descriptions and warn users to check.\n- Hardware reports and guide JSON backups have different buttons, schemas and purposes.\n\n## Kext recommendations\n\nThese are research candidates, not a guaranteed installation list.\n\n- Show reason, checks and official source.\n- Vague names or conflicting data remain pending.\n- Do not recommend IntelMausi for every Intel Ethernet device; I225/I226 are not inferred as IntelMausi.\n- Distinguish RTL8111/8168 from RTL8125.\n- Intel Wi-Fi does not automatically imply Intel Bluetooth.\n- Do not use itlwm and AirportItlwm together; build and strategy depend on macOS.\n- NVMeFix and CpuTscSync are not universal requirements.\n- Do not invent audio layouts.\n\n## Build EFI: a central feature to preserve\n\nThe user particularly liked this feature.\n\n- Shows the inventory used: CPU, generation, memory, GPU, audio, networking, Bluetooth and storage.\n- Offers component checkboxes and explains why to consider them, where to obtain them and where to copy them.\n- Choices are manual. Catalog dependencies enter the plan with a notice.\n- Removing a framework asks for confirmation before removing dependents.\n- Wi-Fi and USB-map alternatives are mutually exclusive.\n- The plan panel shows choices, sources, tree and warnings.\n- Practical instructions cover preparing the base, copying complete packages, creating config.plist from Sample.plist, integrating patches, Snapshot and platform review.\n- Section 3.3 explains SSDTs, compilation, copying, ACPI/Add and associated patches; preserves the catalog and manual AML-name records.\n- Section 3.5 includes collapsible config.plist, CPU, SMBIOS and USB readings from the same reference chapters, without duplicating text or task IDs. The SMBIOS model remains editable in the profile without collecting identities.\n- The plan does not read or validate disk files.\n- Only names of user-generated/reviewed AMLs are recorded; it does not generate SSDTs.\n- Validate AML names; reject paths, HTML and the entire DSDT.\n- Hardware/macOS changes preserve choices but require review and invalidate affected declarations.\n- The demonstrated base plan is UEFI x64, not a universal IA32 or legacy preset.\n- The build outline exports as read-only HTML.\n- JSON backup preserves the editable plan.\n- Downloading public HTML does not embed the user's profile, notes, choices or report.\n\n## ACPI / SSDTs\n\nAn expanded reference contains 21 topics, accessible during preparation and the build's ACPI subsection without creating another main step.\n\nIt includes EC, EC-USBX, USBX, PLUG, Sandy/Ivy CPU-PM, HPET, AWAC, RTC0, RTC0-RANGE, UNC, PMC, RHUB/USB-Reset, PNLF, GPI0, XOSI, SBUS-MCHC, IMEI, Bridge, DMAR, CPUR and dGPU disablement.\n\nDo not call this a list of every existing SSDT. Custom fixes exist. Not every ACPI fix is an SSDT: DMAR is a different table.\n\nEach topic has purpose, conditions, precautions, method and sources. There is no install-all button or automatic catalog-to-plan AML selection.\n\nImportant source-checked points:\n\n- Configure and save BIOS before the final ACPI dump.\n- Do not copy the entire DSDT as a generic solution.\n- AMLs and renames/patches may form one dependent set.\n- HEDT RTC has its own method; do not assume generic RTCAWAC fixes RTC0-RANGE.\n- Dortania's power page notes SSDT-PLUG is not required on macOS 12.3+; do not automatically remove it from a stable EFI.\n- GPIO may already be enabled; XOSI is not mandatory on every laptop.\n- PMC is for specific chipsets, not a universal NVRAM solution.\n- CPUR is not for every AMD system.\n- USB mapping is separate from USBX and USB Reset.\n\n## Structure view\n\nThe EFI tree must fit without horizontal scrolling. The panel was widened, wraps long names and has an expanded view. Do not hide content sideways or require dragging to see it.\n\n## BIOS, SMBIOS and USB details (2.7)\n\n- BIOS: conditional enable/disable guidance, generation-specific CFG Lock, VT-d/DMAR, Above 4G versus Re-Size BAR, DVMT, HEDT, laptop and AMD; current platform link and specific references. Preserve AHCI, BitLocker/TPM and recovery caveats. Not a preset.\n- SMBIOS: distinguishes iMac7,1, iMacPro1,1 and MacPro7,1; teaches criteria, SystemProductName and mapping of privately generated fields. No example serial, automatic model selection or support promise.\n- USB: distinguishes HS/SS from physical connectors, controller limits, 5 Gb/s (not “USB 5.0”), types, internal ports and USB-C, discovery in Windows, USBMap alternative, integration and testing.\n- XhciPortLimit belongs under Kernel/Quirks, not BIOS. Historical temporary-True guidance must be read with macOS 11.3+ caveats and the OpenCore version's documentation. Do not claim every modern OpenCore is unable to apply it; aim for a final map with False, not a universal workaround.\n\n## Data and security\n\n- No backend, account or telemetry: localStorage only.\n- Persistent project key: guia-opencore-publico-v2.\n- Backup schema: 2.\n- Do not change that key or break existing backups without migration.\n- State includes profile, tasks, notes, origins, plan, maturity, testResults and versions.\n- Checks and maturity are user declarations, not automatic tests.\n- Import validates types, enums, limits and known IDs.\n- Escape data before inserting into HTML. Reports and notes may contain malicious text.\n- Never request or publish serial, MLB, SystemUUID, ROM, Apple ID, passwords or recovery keys.\n- Raw hardware JSON is not persisted.\n\n## Sources and licenses\n\nMethod: Dortania OpenCore Install Guide, Getting Started With ACPI and OpenCore Post-Install.\n\nBootloader behavior: Configuration.pdf for the OpenCore version used and release notes.\n\nKexts/tools: their own repositories and documentation.\n\nOpCore Simplify is independent, not an official Dortania method. Treat it as an auditable bonus, not a compatibility promise.\n\nGabriel Luchina community links were removed from public sources at the user's request in edition 2.8. Do not reintroduce them. No files, scripts, EFIs or original text from those repositories were incorporated. Preserve licensing respect and independent writing based on primary sources.\n\n## Audio and Wi-Fi by version (2.8)\n\n- Expanded Audio, Networking and Intel Wi-Fi references without a fifth step or task-ID changes.\n- Main Tahoe source: https://dortania.github.io/OpenCore-Install-Guide/extras/tahoe.html.\n- Tahoe 26 lacks AppleHDA; AppleALC alone cannot enable analog audio. USB/HDMI/DP follow separate paths. VoodooHDA and AppleHDA restoration have requirements/trade-offs, not automatic selection or universal instructions to lower protections.\n- Official AirportItlwm v2.3.0 distinguishes Sonoma 14.0–14.3 from 14.4+. The consulted release has no Sequoia/Tahoe asset. Do not extrapolate that absence to all future development; identify fork author/tag/commit and build.\n- FireWolf's AppleBCMWLANCompanion is an experimental reference, not an automatic catalog selection. The consulted README (declared update November 21, 2025) limits chips to BCM43602 and BCM4350 and lists Sequoia/Tahoe builds; Sonoma 14.8 is unverified.\n- Distinguish Dortania's VT-d/AppleVTD path from the no-IOMapper alternative in BCMC 1.1.0, with memory/performance costs. Do not claim AMD support without evidence.\n- The project requires firmware/hash, PCI properties, boot argument, Lilu and a system without old Wi-Fi root patches. No root patches does not mean no configuration.\n- Do not identify it as the modified kext the user remembered: name/author/link remain unknown.\n- Recommendations and build warnings respond to chosen macOS while preserving old choices and schema-2 backups. No binary, system patch, alcid or security setting is generated/applied.\n\nDo not claim stability testing on platforms that were not actually tested.\n\n## Essential additions and macOS screening (2.9)\n\n- `macos-assessment.js` performs conservative local screening in My hardware after applying a report and during editing. It does not choose macOS, modify the profile, persist derived assessments or generate EFI.\n- Candidate ranges concern CPU/GPU only. Networking, audio, firmware, storage, SMBIOS and tests still need review. Do not call this machine certification or a performance prediction.\n- Unrecognized models, conflicting variants, multiple GPUs, AMD and generations outside the rules do not receive an automatic range. GPU tables checked November 5, 2026 cover up to Sequoia; that is not proof of Tahoe incompatibility.\n- RAM is manual; missing capacity is not inferred. The old low-RAM multitasking advice was editorial, not a benchmark or per-macOS ceiling; version 3.0 superseded it.\n- Added content was limited to storage-model warnings, WhateverGreen/Tahoe, Intel SST microphone, Recovery networking, boot-stage diagnosis, NVRAM testing and coordinated update files.\n- The NVRAM test does not distinguish native from emulated persistence; do not copy a historical emulation recipe without the matching version documentation.\n- Preserve schema 2, storage key, IDs, signature and four steps. Also test `node --test guide/tests/macos-assessment.test.cjs` and `node --check guide/macos-assessment.js`.\n\n## Component review and local records (3.0)\n\n- Preserve “Which macOS should I consider?” without smoothness, slowness or RAM-pressure comments. Version 3.0 replaces 2.9's resource advice.\n- `profile.displayGpu` is a manual choice from `gpuChoices(profile)`. With multiple GPUs, `displayConnection: \"confirmed\"` is required before using the choice in screening. Inventory changes reset the declaration. Never disable other GPUs automatically.\n- `profile.macosVersion` and `profile.macosBuild` are manual, not imported from Hardware Report. Discrepancies and known minima are shown without changing target macOS.\n- `project-review.js` contains conservative component review, adaptive tests, record normalization and context identification.\n- Schema 2 gains optional `testResults` and `versions`. Old backups receive empty objects. Do not change the localStorage key.\n- Adaptive tests are separate from historical tasks: Not tested, Verified, Issue found or Not used, with evidence. They appear in step 4 and the notebook. Unknown data does not mean absence. Out-of-profile records are preserved.\n- Test context includes hardware, target/build, declared GPU, SMBIOS, plan and recorded versions; changes require review without erasing results/evidence. Only explicit declaration reconfirms; editing evidence is insufficient. Compact context identification is not a security signature.\n- Manifest records version, origin and tag/commit/variant per catalog component. OpenCore uses `profile.oc` as its single canonical version. Removing a component does not erase its record.\n- New fields are validated and escaped in screens and reports. Provenance records do not verify binaries/URLs. No automatic downloads or backend.\n- HTML reports and backups include records; public HTML remains clean. Test `guide/tests/project-review.test.cjs` in addition to existing tests.\n\n## SMBIOS, USB/X99 and CPU/Xeon (3.1)\n\n- `smbiosModelCatalog` and `smbiosModelReview` live in macos-assessment.js. They compare a few models without choosing SMBIOS. Reference and Build reuse cards through chapterReading/smbiosComparisonHtml.\n- iMacPro1,1: High Sierra 10.13.2/initial build 17C2111 through Sequoia 15; not on Tahoe's native list. MacPro7,1: Catalina 10.15 through Tahoe within the checked scope, not High Sierra/Mojave. Confirm initial builds. iMac19,1 and iMac20,1 illustrate Intel desktop choices, not presets.\n- Dortania's general list still says Current for some models; OS-specific Apple lists 120282/122867 were also used for Sequoia/Tahoe. Do not equate Apple-model support with PC compatibility or infer support beyond Tahoe.\n- BIOS/SMBIOS review identifies an out-of-range target without changing the profile; models outside the short comparison remain pending.\n- XhciPortLimit is Kernel/Quirks (Boolean), not a kext, BIOS option, map or SuperSpeed enablement. The X99 sequence identifies controllers and generates a machine-specific map. A build shortcut opens existing USBToolBox/UTBMap or USBMap choices without selecting them.\n- The changelog documents quirk improvements in OC 0.9.3 (11–14) and 1.0.7 (Tahoe). Do not claim every modern version cannot apply it; Configuration.pdf still recommends avoiding the workaround and limiting ports. Final map uses False.\n- CPU/Xeon covers Emulate, ExtraMsrs, CFG Lock, X86PlatformPlugin verification and clocks. ForceBoost forces the maximum XCPM multiplier and is discouraged for general use; it is not normal Turbo Boost. CPUFriend requires need and configuration-specific data. No turbo unlock, microcode removal, modified firmware or universal CPUID/multipliers.\n- CPU reading is available in build section 3.5; previous tasks and backups remain preserved.\n\n## Portuguese and English (3.2)\n\n- Both languages are embedded in the same offline HTML. The header button switches languages without external services.\n- The independent preference key is `opencore-interativo-language-v1`; default is Portuguese. Switching must also work in memory if storage is blocked.\n- `guide/i18n/compile.cjs` uses the installed TypeScript parser to localize literal text only. Hash-keyed translations live in `guide/i18n/en/`; reviewed technical/English identities are in `identity.json`. Never translate user inputs, schema keys, IDs, commands, paths or URLs.\n- Reinitialize display structures in an isolated runtime on a language switch, abort old listeners, and preserve project data, current view and open sections.\n- Keep a single clean public-document snapshot from before rendering. Do not recapture user-filled HTML on a language switch.\n- UI, chapters, catalogs, assessments, dialogs, messages, HTML report, build outline and this handoff are localized. User notes and recorded provenance are preserved verbatim.\n- Translation tests must verify English content, interpolation integrity, technical identifiers, privacy, search, import/export, state preservation and repeated switching on desktop/mobile.\n\n## If you received only the HTML\n\nPreserve a complete copy before editing. CSS, data, translations and JavaScript are embedded. Do not remove functionality by rebuilding only the appearance.\n\nFind VERSION and STORAGE, catalogs, hardware parser and navigation/build functions. Preserve task/component IDs and schema 2.\n\nValidate the offline HTML and real browser flows: import/cancel/apply, editing, component choices, dependencies, alternatives, profile-change warnings, save/restore, language switching and clean public downloads.\n\n## If you received the repository\n\n- src/App.tsx displays the HTML in an iframe.\n- Public file: public/downloads/GUIA-INTERATIVO-OPENCORE.html.\n- Maintained sources are under guide/: content.js, acpi-catalog.js, recommendations.js, macos-assessment.js, project-review.js, hardware-import.js, assembly.js, assembly-ui.js, navigation.js, app.js, i18n.js, i18n/ and style.css.\n- guide/build.py regenerates the self-contained HTML. Edit maintained sources and regenerate rather than patching only the output.\n- guide/tests uses synthetic fixtures.\n- Read AGENTS.md before working.\n- The preview server is supervised; do not start another development server.\n- Do not add a backend or unnecessary dependencies for local features.\n\nMain commands:\n\n    python guide/build.py\n    node --test guide/tests/*.test.cjs\n    node --check guide/app.js\n    pnpm run format --check guide/app.js guide/acpi-catalog.js guide/assembly-ui.js\n    pnpm exec tsc --noEmit\n    pnpm run build\n\nBeyond the build, test desktop/mobile interactions and both languages, and confirm the production HTML matches the public file.\n"

function filteredAcpiCatalog(query = "") {
    const normalize = (value) => String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    const q = normalize(query.trim());
    return acpiCatalog.filter((item) => !q ||
        normalize([
            item.name,
            item.category,
            item.type,
            item.purpose,
            item.when,
            item.caution,
            item.method,
        ].join(" ")).includes(q));
}
function acpiCatalogRows(query = "") {
    const items = filteredAcpiCatalog(query);
    return items.length
        ? items

    const suggested = assemblyCatalog.filter((item) => item.candidate && candidateIds.has(item.candidate));
    const other = assemblyCatalog.filter((item) => !suggested.includes(item));
    const guide = assemblyGenerationGuide(state.profile);
    const grouped = [...new Set(suggested.map((item) => item.category))];
    return (heading(L("ETAPA 3 DE 4 \u00B7 MONTAGEM GUIADA", "STEP 3 OF 4 \u00B7 GUIDED BUILD"), L("Do invent\u00E1rio \u00E0 pasta EFI.", "From inventory to EFI folder."), L("Veja o que considerar para o seu hardware, por que usar, de onde obter e onde copiar. O painel do plano registra somente o que voc\u00EA escolheu.", "See what to consider for your hardware, why to use it, where to obtain it and where to copy it. The plan panel records only your choices."), L.format("<button class=\"button secondary\" data-view=\"profile\">Editar hardware {{0}}</button>", "<button class=\"button secondary\" data-view=\"profile\">Edit hardware {{0}}</button>", [icon("chip")])) + L.format("<div class=\"assembly-mobile-shortcut\"><button class=\"button secondary\" data-action=\"show-plan\">Ver meu plano ({{0}}) {{1}}</button></div>\n    <div class=\"assembly-layout\"><div class=\"assembly-main\">{{2}}\n    <div class=\"notice\"><div><strong>Esta \u00E9 a montagem. A prepara\u00E7\u00E3o fica na etapa 2.</strong><p>Use o invent\u00E1rio revisado e os SSDTs que voc\u00EA preparou. Se ainda faltam backup, BIOS ou dump ACPI, volte \u00E0 prepara\u00E7\u00E3o antes de copiar arquivos.</p><button class=\"text-button\" data-view=\"preparation\">Voltar a 2 \u00B7 Preparar BIOS e ACPI {{3}}</button></div></div>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.1 \u00B7 OBTER E SEPARAR A BASE</div><h2>Comece pela estrutura do OpenCore.</h2><p>Escolha o pacote de OpenCore conforme a arquitetura do firmware e a edi\u00E7\u00E3o adequada ao diagn\u00F3stico. Em firmware x64 UEFI, o ponto de partida usual \u00E9 a pasta <code>X64/EFI</code>; hardware legado exige o caminho correspondente no Dortania, n\u00E3o uma c\u00F3pia cega.</p>\n    <ol class=\"assembly-instructions\"><li>Extraia o pacote oficial em uma pasta de trabalho separada da EFI funcional.</li><li>Preserve <code>EFI/BOOT/BOOTx64.efi</code> e <code>EFI/OC/OpenCore.efi</code>.</li><li>Separe <code>OpenRuntime.efi</code> do mesmo pacote para <code>EFI/OC/Drivers</code>.</li><li>Copie <code>Docs/Sample.plist</code> para <code>EFI/OC/config.plist</code>. Ele ainda precisa ser configurado.</li><li>Revise Drivers e Tools: n\u00E3o copie tudo. Pastas ACPI e Kexts receber\u00E3o somente os componentes escolhidos e verificados.</li></ol>\n    <div class=\"source-box\">{{4}}{{5}}{{6}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.2 \u00B7 ESCOLHER COM MOTIVO</div><h2>Candidatos ligados ao seu invent\u00E1rio.</h2><p>Marque apenas depois de conferir o modelo e a fonte. Ao incluir um plugin, suas depend\u00EAncias de cat\u00E1logo entram no plano. Alternativas de Wi-Fi e de mapa USB se substituem; a interface avisa, n\u00E3o habilita as duas.</p>\n    {{7}}\n    {{8}}\n    </section>\n    <details class=\"panel assembly-extra\" id=\"assembly-extras\"><summary>Drivers, sensores, mapa USB e escolhas fora das sugest\u00F5es</summary><p>Consulta manual. Aparecer nesta lista n\u00E3o significa necessidade ou suporte. Componentes j\u00E1 selecionados continuam dispon\u00EDveis mesmo se voc\u00EA alterar o hardware.</p>{{9}}</details>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.3 \u00B7 SSDTs E INTEGRA\u00C7\u00C3O ACPI</div><h2>Escolha com evid\u00EAncia, copie e cadastre os SSDTs.</h2><p>A gera\u00E7\u00E3o fica na etapa 2; aqui voc\u00EA integra o resultado \u00E0 EFI. O cat\u00E1logo abaixo explica cada corre\u00E7\u00E3o, sem adicionar arquivos automaticamente. N\u00E3o existe pacote \u201Ctodos os SSDTs\u201D.</p>\n    <ol class=\"assembly-instructions\"><li>Na se\u00E7\u00E3o <strong>ACPI</strong> da p\u00E1gina da sua gera\u00E7\u00E3o, identifique as corre\u00E7\u00F5es e confirme as condi\u00E7\u00F5es no dump final. N\u00E3o use s\u00F3 o nome da placa.</li><li>Confira o fonte <code>.dsl</code>, os caminhos dos dispositivos e o resultado compilado <code>.aml</code>. EC/EC-USBX t\u00EAm estrat\u00E9gias diferentes entre desktop e notebook; preserve o EC real quando necess\u00E1rio. PLUG depende da gera\u00E7\u00E3o e do macOS, n\u00E3o \u00E9 para todo processador.</li><li>Copie somente os AMLs revisados para <code>EFI/OC/ACPI</code>. N\u00E3o copie o DSDT completo nem o fonte DSL como se fosse AML; evite corre\u00E7\u00F5es equivalentes duplicadas.</li><li>Registre os nomes abaixo para inclu\u00ED-los na \u00E1rvore e no backup. Na subetapa 3.4, integre patches/renames associados e confira cada <code>ACPI/Add/Path</code> com <code>Enabled</code> adequado.</li><li>Em <code>ACPI/Patch</code> e <code>ACPI/Delete</code>, confirme alvo, condi\u00E7\u00E3o e necessidade. Um AML dependente de rename pode n\u00E3o funcionar sozinho. Valide o plist e teste no computador-alvo pela m\u00EDdia de recupera\u00E7\u00E3o.</li></ol>\n    <a class=\"source-link\" href=\"{{10}}\" target=\"_blank\" rel=\"noreferrer\">Consultar ACPI da plataforma: {{11}} {{12}}</a>\n    <div class=\"aml-form\"><label class=\"field\"><span>Nome do SSDT revisado</span><input id=\"plan-aml-name\" maxlength=\"100\" placeholder=\"Ex.: SSDT-EC.aml\"></label><button class=\"button secondary\" data-action=\"add-plan-aml\">Adicionar ao plano</button></div><p class=\"field-help\">Somente o nome do arquivo, sem pasta. N\u00E3o adicionar DSDT completo. O nome n\u00E3o valida o conte\u00FAdo.</p>\n    <ul class=\"aml-list\">{{13}}</ul>\n    {{14}}\n    <p>Se o SSDT exige rename ou patch, integre os patches ao plist com PatchMerge e compare antes/depois. Copiar o AML sozinho pode ser insuficiente.</p><div class=\"inline-actions\"><button class=\"text-button\" data-chapter=\"ssdt-gerar\">Como gerar SSDTs</button><button class=\"text-button\" data-chapter=\"patchmerge\">Como usar PatchMerge</button></div>{{15}}</section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.4 \u00B7 FAZER O PLIST CORRESPONDER \u00C0 PASTA</div><h2>Integre os patches e cadastre os arquivos.</h2><ol class=\"assembly-instructions\"><li>Use o <code>config.plist</code> criado a partir de <code>Docs/Sample.plist</code> na subetapa 3.1.</li><li>Se os SSDTs da prepara\u00E7\u00E3o exigem patches, fa\u00E7a backup do plist, aplique PatchMerge e compare a c\u00F3pia resultante antes de substituir. Confira <code>ACPI/Patch</code> e <code>ACPI/Delete</code>; n\u00E3o duplique uma mesclagem anterior.</li><li>Abra o plist revisado no ProperTree. Use <code>Command/Ctrl + Shift + R</code> e selecione a pasta <code>EFI/OC</code>.</li><li>Revise <code>Kernel/Add</code>, <code>ACPI/Add</code>, <code>UEFI/Drivers</code> e ferramentas. Confira plugins e execut\u00E1veis reais; injectors plist-only n\u00E3o possuem bin\u00E1rio.</li><li>N\u00E3o confunda Snapshot com configura\u00E7\u00E3o autom\u00E1tica de quirks. Ele sincroniza listas, n\u00E3o valida o hardware.</li></ol>\n    <div class=\"source-box\">{{16}}{{17}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.5 \u00B7 CONFIG.PLIST, SMBIOS E USB</div><h2>Configure a plataforma, o modelo e as portas.</h2><p>Leia os blocos abaixo sem sair da montagem. O conte\u00FAdo \u00E9 o mesmo da consulta; os checklists e notas permanecem nos artigos, sem criar tarefas duplicadas.</p>\n    <a class=\"source-link\" href=\"{{18}}\" target=\"_blank\" rel=\"noreferrer\">{{19}} {{20}}</a>{{21}}\n    <ul><li><strong>CPU:</strong> {{22}}. Conferir Emulate/quirks da gera\u00E7\u00E3o; n\u00E3o gerar CPUID a partir do nome.</li><li><strong>GPU:</strong> {{23}}. Confirmar acelera\u00E7\u00E3o, propriedades e conectores; n\u00E3o inferir framebuffer ou argumentos.</li><li><strong>\u00C1udio:</strong> {{24}}. Conferir codec e layouts; n\u00E3o escolher alcid por aproxima\u00E7\u00E3o.</li><li><strong>SMBIOS:</strong> {{25}}. Gerar identidade individual fora deste guia e n\u00E3o public\u00E1-la.</li><li><strong>USB:</strong> mapear portas e testar. USBX/USB Reset n\u00E3o s\u00E3o o mapa.</li></ul>\n    {{26}}\n    {{27}}\n    {{28}}\n    {{29}}\n    <div class=\"inline-actions\"><button class=\"text-button\" data-view=\"profile\">Registrar ou editar o modelo SMBIOS em Meu hardware {{30}}</button></div>\n    {{31}}\n    <div class=\"source-box\"><strong>Arquivos do mapa USB no planejador</strong><p>XhciPortLimit \u00E9 um ajuste do plist, n\u00E3o uma kext. No m\u00E9todo USBToolBox com depend\u00EAncia, escolha USBToolBox.kext + seu UTBMap.kext gerado; USBMap \u00E9 uma alternativa. Nada \u00E9 selecionado automaticamente.</p><button class=\"text-button\" data-action=\"show-usb-options\">Mostrar op\u00E7\u00F5es de mapa USB {{32}}</button>{{33}}{{34}}</div>\n    </section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.6 \u00B7 FECHAR O PLANO DE MONTAGEM</div><h2>O que voc\u00EA conferiu nesta montagem?</h2><p>As caixas abaixo s\u00E3o declara\u00E7\u00F5es manuais, n\u00E3o verifica\u00E7\u00F5es autom\u00E1ticas. A valida\u00E7\u00E3o com ocvalidate e o teste de boot ficam na etapa 4.</p>{{35}}\n    <div class=\"notice compact\">O plano n\u00E3o \u00E9 uma EFI gerada. Mesmo com as caixas marcadas, os arquivos ainda precisam ser validados e testados.</div><div class=\"inline-actions\"><button class=\"button\" data-view=\"installation\">Pr\u00F3xima etapa: 4 \u00B7 Instalar e testar {{36}}</button></div></section>\n    </div>{{37}}</div>", "<div class=\"assembly-mobile-shortcut\"><button class=\"button secondary\" data-action=\"show-plan\">View my plan ({{0}}) {{1}}</button></div>\n    <div class=\"assembly-layout\"><div class=\"assembly-main\">{{2}}\n    <div class=\"notice\"><div><strong>This is the build. Preparation is step 2.</strong><p>Use the reviewed inventory and prepared SSDTs. If backup, BIOS or ACPI dump are still missing, return to preparation before copying files.</p><button class=\"text-button\" data-view=\"preparation\">Back to 2 \u00B7 Prepare BIOS and ACPI {{3}}</button></div></div>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.1 \u00B7 OBTAIN AND PREPARE THE BASE</div><h2>Start with the OpenCore structure.</h2><p>Choose the OpenCore package according to firmware architecture and the edition appropriate for diagnosis. On x64 UEFI firmware, the usual starting point is <code>X64/EFI</code>; legacy hardware requires Dortania's matching path, not a blind copy.</p>\n    <ol class=\"assembly-instructions\"><li>Extract the official package into a working folder separate from the working EFI.</li><li>Keep <code>EFI/BOOT/BOOTx64.efi</code> and <code>EFI/OC/OpenCore.efi</code>.</li><li>Take <code>OpenRuntime.efi</code> from the same package and place it in <code>EFI/OC/Drivers</code>.</li><li>Copy <code>Docs/Sample.plist</code> to <code>EFI/OC/config.plist</code>. It still needs configuration.</li><li>Review Drivers and Tools: do not copy everything. ACPI and Kexts folders receive only chosen, verified components.</li></ol>\n    <div class=\"source-box\">{{4}}{{5}}{{6}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.2 \u00B7 CHOOSE WITH A REASON</div><h2>Candidates linked to your inventory.</h2><p>Select only after checking the model and source. Adding a plugin adds its catalog dependencies to the plan. Wi-Fi and USB-map alternatives replace one another; the interface warns rather than enabling both.</p>\n    {{7}}\n    {{8}}\n    </section>\n    <details class=\"panel assembly-extra\" id=\"assembly-extras\"><summary>Drivers, sensors, USB maps and choices outside the suggestions</summary><p>Manual reference. Being listed does not establish necessity or support. Selected components remain available even if hardware changes.</p>{{9}}</details>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.3 \u00B7 SSDTs AND ACPI INTEGRATION</div><h2>Choose with evidence, copy and register SSDTs.</h2><p>Generation happens in step 2; here you integrate the result into the EFI. The catalog below explains each fix without adding files automatically. There is no \u201Call SSDTs\u201D package.</p>\n    <ol class=\"assembly-instructions\"><li>In the <strong>ACPI</strong> section of your generation's page, identify fixes and confirm their conditions in the final dump. Do not rely only on the board's name.</li><li>Check the source <code>.dsl</code>, device paths and the compiled result <code>.aml</code>. EC/EC-USBX strategies differ between desktops and laptops; preserve the real EC when necessary. PLUG depends on generation and macOS, not every processor.</li><li>Copy only reviewed AMLs to <code>EFI/OC/ACPI</code>. Do not copy the full DSDT or DSL source as if it were AML; avoid duplicate equivalent fixes.</li><li>Record names below for the tree and backup. In section 3.4, integrate associated patches/renames and check each <code>ACPI/Add/Path</code> with <code>Enabled</code> set appropriately.</li><li>Under <code>ACPI/Patch</code> and <code>ACPI/Delete</code>, confirm target, condition and necessity. An AML dependent on a rename may not work alone. Validate the plist and test on the target computer using recovery media.</li></ol>\n    <a class=\"source-link\" href=\"{{10}}\" target=\"_blank\" rel=\"noreferrer\">Consult platform ACPI: {{11}} {{12}}</a>\n    <div class=\"aml-form\"><label class=\"field\"><span>Reviewed SSDT filename</span><input id=\"plan-aml-name\" maxlength=\"100\" placeholder=\"E.g. SSDT-EC.aml\"></label><button class=\"button secondary\" data-action=\"add-plan-aml\">Add to plan</button></div><p class=\"field-help\">Filename only, without a folder. Do not add the entire DSDT. The name does not validate the content.</p>\n    <ul class=\"aml-list\">{{13}}</ul>\n    {{14}}\n    <p>If an SSDT requires a rename or patch, integrate patches into the plist with PatchMerge and compare before/after. Copying the AML alone may be insufficient.</p><div class=\"inline-actions\"><button class=\"text-button\" data-chapter=\"ssdt-gerar\">How to generate SSDTs</button><button class=\"text-button\" data-chapter=\"patchmerge\">How to use PatchMerge</button></div>{{15}}</section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.4 \u00B7 MATCH THE PLIST TO THE FOLDER</div><h2>Integrate patches and register files.</h2><ol class=\"assembly-instructions\"><li>Use the <code>config.plist</code> created from <code>Docs/Sample.plist</code> in section 3.1.</li><li>If the preparation SSDTs require patches, back up the plist, apply PatchMerge and compare the resulting copy before replacing it. Check <code>ACPI/Patch</code> and <code>ACPI/Delete</code>; do not duplicate a previous merge.</li><li>Open the reviewed plist in ProperTree. Use <code>Command/Ctrl + Shift + R</code> and select the folder <code>EFI/OC</code>.</li><li>Review <code>Kernel/Add</code>, <code>ACPI/Add</code>, <code>UEFI/Drivers</code> and tools. Check actual plugins and executables; plist-only injectors have no binary.</li><li>Do not confuse Snapshot with automatic quirk configuration. It synchronizes lists, not hardware validity.</li></ol>\n    <div class=\"source-box\">{{16}}{{17}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.5 \u00B7 CONFIG.PLIST, SMBIOS AND USB</div><h2>Configure the platform, model and ports.</h2><p>Read the sections below without leaving the build. Content is shared with the reference; checklists and notes stay in the articles without duplicating tasks.</p>\n    <a class=\"source-link\" href=\"{{18}}\" target=\"_blank\" rel=\"noreferrer\">{{19}} {{20}}</a>{{21}}\n    <ul><li><strong>CPU:</strong> {{22}}. Check generation-specific Emulate/quirks; do not generate CPUID from the name.</li><li><strong>GPU:</strong> {{23}}. Confirm acceleration, properties and connectors; do not infer framebuffer or arguments.</li><li><strong>Audio:</strong> {{24}}. Check codec and layouts; do not approximate alcid.</li><li><strong>SMBIOS:</strong> {{25}}. Generate an individual identity outside this guide and do not publish it.</li><li><strong>USB:</strong> map ports and test. USBX/USB Reset are not the map.</li></ul>\n    {{26}}\n    {{27}}\n    {{28}}\n    {{29}}\n    <div class=\"inline-actions\"><button class=\"text-button\" data-view=\"profile\">Record or edit the SMBIOS model in My hardware {{30}}</button></div>\n    {{31}}\n    <div class=\"source-box\"><strong>USB map files in the planner</strong><p>XhciPortLimit is a plist setting, not a kext. For the USBToolBox-dependent method, choose USBToolBox.kext + your generated UTBMap.kext; USBMap is an alternative. Nothing is selected automatically.</p><button class=\"text-button\" data-action=\"show-usb-options\">Show USB mapping options {{32}}</button>{{33}}{{34}}</div>\n    </section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.6 \u00B7 COMPLETE THE BUILD PLAN</div><h2>What did you verify in this build?</h2><p>The boxes below are manual declarations, not automatic checks. ocvalidate and boot testing are in step 4.</p>{{35}}\n    <div class=\"notice compact\">The plan is not a generated EFI. Even with boxes checked, files still need validation and testing.</div><div class=\"inline-actions\"><button class=\"button\" data-view=\"installation\">Next step: 4 \u00B7 Install and test {{36}}</button></div></section>\n    </div>{{37}}</div>", [result.selected.length, icon("arrow"), assemblyHardwareSummary(), icon("arrow"), refLink("baseefi"), refLink("oc"), refLink("config"), suggested.length
            ? grouped
                .map((category) => `<section class="assembly-category"><h3>${esc(category)}</h3>${suggested
                .filter((item) => item.category === category)
                .map((item) => assemblyChoiceCard(item, assemblyEvidence(item)))
                .join("")}</section>`)
                .join("")
            : L("<div class=\"empty-state\"><h3>Primeiro identifique seu hardware.</h3><p>Nenhum candidato espec\u00EDfico foi reconhecido. Preencha o invent\u00E1rio ou consulte a fonte do controlador; n\u00E3o vamos inventar um driver.</p><button class=\"button secondary\" data-view=\"profile\">Preencher hardware</button></div>", "<div class=\"empty-state\"><h3>Identify your hardware first.</h3><p>No specific candidate recognized. Complete the inventory or consult the controller's source; we will not invent a driver.</p><button class=\"button secondary\" data-view=\"profile\">Enter hardware</button></div>"), result.recommendations.items
            .filter((rec) => !assemblyCatalog.some((item) => item.candidate === rec.id))
            .map((rec) => L.format("<div class=\"notice compact\"><div><strong>{{0}}</strong><p>{{1}}</p><a href=\"{{2}}\" target=\"_blank\" rel=\"noreferrer\">Investigar a fonte antes de escolher um pacote</a></div></div>", "<div class=\"notice compact\"><div><strong>{{0}}</strong><p>{{1}}</p><a href=\"{{2}}\" target=\"_blank\" rel=\"noreferrer\">Investigate the source before choosing a package</a></div></div>", [esc(rec.title), esc(rec.verify), esc(rec.url)]))
            .join(""), other.map((item) => assemblyChoiceCard(item)).join(""), esc(guide.url), esc(guide.label), icon("external"), state.plan.amls.map((name) => L.format("<li><code>EFI/OC/ACPI/{{0}}</code><button data-plan-aml-remove=\"{{1}}\" aria-label=\"Retirar {{2}}\">Retirar</button></li>", "<li><code>EFI/OC/ACPI/{{0}}</code><button data-plan-aml-remove=\"{{1}}\" aria-label=\"Remove {{2}}\">Remove</button></li>", [esc(name), esc(name), esc(name)])).join(""), acpiCatalogSection("assembly"), refLink("easy"), refLink("proper"), refLink("config"), esc(guide.url), icon("external"), esc(guide.label), !guide.matched
            ? L("<p class=\"profile-warning\">Ainda n\u00E3o localizamos um caminho exato para o codinome informado. Use o \u00EDndice e confirme a gera\u00E7\u00E3o antes de aplicar valores.</p>", "<p class=\"profile-warning\">No exact path was found for the reported codename. Use the index and confirm the generation before applying values.</p>") : "", esc(state.profile.cpu || L("n\u00E3o informada", "not provided")), esc(state.profile.gpu || L("n\u00E3o informada", "not provided")), esc(state.profile.audio || L("n\u00E3o informado", "not provided")), esc(state.profile.smbios || L("modelo ainda a escolher", "model not yet chosen")), state.profile.platform === "amd"
            ? L("<p class=\"notice\">AMD: obtenha e ajuste os patches AMD Vanilla conforme a documenta\u00E7\u00E3o. Esta lista n\u00E3o produz patches de kernel.</p>", "<p class=\"notice\">AMD: obtain and adjust AMD Vanilla patches according to the documentation. This list does not produce kernel patches.</p>") : "", assemblyReading("config-secoes", L("Config.plist \u00B7 da base \u00E0s oito se\u00E7\u00F5es", "Config.plist \u00B7 from the base to the eight sections"), true), assemblyReading("cpu", L("CPU / Xeon \u00B7 spoof, XCPM, clocks e ForceBoost", "CPU / Xeon \u00B7 spoofing, XCPM, clocks and ForceBoost")), assemblyReading("smbios", L("SMBIOS \u00B7 escolher e configurar o modelo", "SMBIOS \u00B7 choosing and configuring the model")), icon("arrow"), assemblyReading("usb", L("USB \u00B7 mapear HS/SS, tipos e conferir XhciPortLimit", "USB \u00B7 mapping HS/SS, types and checking XhciPortLimit")), icon("arrow"), refLink("usbtool"), refLink("usbmap"), assemblySteps
            .filter(([id]) => id !== "validate")

            .join(""), icon("arrow"), assemblySummary()]));

function showExpandedTree() {
    const dialog = document.getElementById("tree-preview");
    dialog.innerHTML = L.format("<header class=\"tree-preview-header\"><div><span class=\"eyebrow\">LEITURA AMPLIADA \u00B7 PLANO, N\u00C3O ARQUIVOS GERADOS</span><h2 id=\"tree-preview-title\">Estrutura planejada da EFI</h2></div><button class=\"button secondary small\" data-action=\"close-tree\">Fechar</button></header><div class=\"tree-preview-content\"><p>As linhas longas quebram automaticamente. A estrutura reflete suas escolhas e nomes de AML; o guia n\u00E3o conferiu o conte\u00FAdo do seu disco.</p><pre class=\"plan-tree expanded-tree\"><code>{{0}}</code></pre></div>", "<header class=\"tree-preview-header\"><div><span class=\"eyebrow\">EXPANDED VIEW \u00B7 PLAN, NOT GENERATED FILES</span><h2 id=\"tree-preview-title\">Planned EFI structure</h2></div><button class=\"button secondary small\" data-action=\"close-tree\">Close</button></header><div class=\"tree-preview-content\"><p>Long lines wrap automatically. The structure reflects your choices and AML names; the guide has not checked disk contents.</p><pre class=\"plan-tree expanded-tree\"><code>{{0}}</code></pre></div>", [esc(assemblyTree(state.plan))]);
    dialog.showModal();
}
function refreshAssemblyView(focusSelector) {
    const scroll = window.scrollY;
    const opened = [...document.querySelectorAll("details[id][open]")].map((item) => item.id);
    renderMain();
    opened.forEach((id) => {
        const el = document.getElementById(id);
        if (el)
            el.open = true;
    });
    if (focusSelector)
        document.querySelector(focusSelector)?.focus({ preventScroll: true });
    window.scrollTo({ top: scroll, behavior: "instant" });
}

function hardwareHelp() {
    return L.format("<section class=\"panel hardware-help\"><div class=\"panel-heading\"><div><span class=\"eyebrow\">ANTES DE PREENCHER</span><h2>Como descobrir o que tem no seu computador</h2></div><span class=\"badge\">Sem detec\u00E7\u00E3o pelo navegador</span></div>\n    <p>O HTML n\u00E3o l\u00EA seus dispositivos. Use uma das ferramentas abaixo no computador-alvo, revise o relat\u00F3rio e preencha o invent\u00E1rio. Depois de configurar e salvar a BIOS, gere novamente o relat\u00F3rio e o dump ACPI definitivo.</p>\n    <div class=\"tool-grid\">\n      <article class=\"tool-card\"><span class=\"badge\">Windows \u00B7 citado no Dortania</span><h3>AIDA64 + Gerenciador de Dispositivos</h3><p>No AIDA64, consulte CPU, chipset, v\u00EDdeo, armazenamento, rede e codec de \u00E1udio. No Gerenciador: dispositivo \u2192 Propriedades \u2192 Detalhes \u2192 IDs de Hardware. Use \u201CDispositivos por conex\u00E3o\u201D para distinguir touchpad I2C, PS/2, SMBus ou USB.</p><a href=\"https://www.aida64.com/downloads\" target=\"_blank\" rel=\"noreferrer\">Site oficial do AIDA64 {{0}}</a>{{1}}</article>\n      <article class=\"tool-card\"><span class=\"badge\">M\u00E9todo citado no Dortania</span><h3>OCSysInfo</h3><p>Baixe o bin\u00E1rio correspondente ao sistema nas releases. Execute e use a descoberta de hardware indicada no menu \u2014 o guia descreve a op\u00E7\u00E3o \u201Cd\u201D. Registre CPU/codinome, GPU, codec, rede e conex\u00E3o dos dispositivos. N\u00E3o copie apenas o nome comercial.</p><a href=\"https://github.com/KernelWanderers/OCSysInfo/releases\" target=\"_blank\" rel=\"noreferrer\">Releases do OCSysInfo {{2}}</a>{{3}}</article>\n      <article class=\"tool-card\"><span class=\"badge\">Windows \u00B7 projeto independente</span><h3>Hardware Sniffer</h3><p>Baixe nas releases oficiais e execute no computador-alvo. Para preencher este HTML, use apenas Export Hardware Report e selecione o JSON da pasta Results. Dump ACPI Tables \u00E9 uma etapa separada para SSDTs, n\u00E3o uma entrada desta importa\u00E7\u00E3o. O backup de progresso JSON do guia tamb\u00E9m \u00E9 outro formato.</p><a href=\"https://github.com/lzhoang2801/Hardware-Sniffer\" target=\"_blank\" rel=\"noreferrer\">Projeto e instru\u00E7\u00F5es {{4}}</a></article>\n    </div>\n    <details class=\"help-details\"><summary>Estou no Linux: comandos \u00FAteis para o invent\u00E1rio</summary><p>O Dortania descreve pciutils, dmidecode e ferramentas de invent\u00E1rio. A disponibilidade e as permiss\u00F5es variam por distribui\u00E7\u00E3o. Consulte o manual antes de instalar ou executar.</p><pre><code>grep -i \"model name\" /proc/cpuinfo\nlspci -nnk\nlsusb\nlshw -class network\nlshw -class disk -class storage</code></pre><p>Registre o modelo exato e os IDs. O codinome deve ser confirmado no guia da plataforma ou na ficha do fabricante; n\u00E3o o deduza apenas do n\u00FAmero de n\u00FAcleos ou do \u201Cv3/v4\u201D.</p>{{5}}{{6}}</details>\n    <div class=\"notice compact\"><strong>Evite expor dados pessoais.</strong> Relat\u00F3rios podem conter identificadores, caminhos ou dados do sistema. Revise antes de publicar. Nunca digite serial, MLB, ROM, UUID, senhas ou chaves de recupera\u00E7\u00E3o aqui.</div>\n    </section>", "<section class=\"panel hardware-help\"><div class=\"panel-heading\"><div><span class=\"eyebrow\">BEFORE ENTERING DATA</span><h2>How to identify what is in your computer</h2></div><span class=\"badge\">No browser-based detection</span></div>\n    <p>This HTML does not read your devices. Run one of the tools below on the target computer, review the report and complete the inventory. After configuring and saving BIOS, regenerate the report and final ACPI dump.</p>\n    <div class=\"tool-grid\">\n      <article class=\"tool-card\"><span class=\"badge\">Windows \u00B7 cited by Dortania</span><h3>AIDA64 + Device Manager</h3><p>In AIDA64, check CPU, chipset, graphics, storage, networking and audio codec. In Device Manager: device \u2192 Properties \u2192 Details \u2192 Hardware IDs. Use \u201CDevices by connection\u201D to distinguish I2C, PS/2, SMBus or USB touchpads.</p><a href=\"https://www.aida64.com/downloads\" target=\"_blank\" rel=\"noreferrer\">Official AIDA64 website {{0}}</a>{{1}}</article>\n      <article class=\"tool-card\"><span class=\"badge\">Method cited by Dortania</span><h3>OCSysInfo</h3><p>Download the binary matching your OS from releases. Run it and use the hardware discovery option in the menu \u2014 the guide describes \u201Cd\u201D. Record CPU/codename, GPU, codec, networking and device connections. Do not copy only the commercial name.</p><a href=\"https://github.com/KernelWanderers/OCSysInfo/releases\" target=\"_blank\" rel=\"noreferrer\">OCSysInfo releases {{2}}</a>{{3}}</article>\n      <article class=\"tool-card\"><span class=\"badge\">Windows \u00B7 independent project</span><h3>Hardware Sniffer</h3><p>Download from official releases and run on the target computer. To fill in this HTML, use only Export Hardware Report and select the JSON in Results. Dump ACPI Tables is a separate SSDT step, not an input for this import. The guide's JSON progress backup is also a different format.</p><a href=\"https://github.com/lzhoang2801/Hardware-Sniffer\" target=\"_blank\" rel=\"noreferrer\">Project and instructions {{4}}</a></article>\n    </div>\n    <details class=\"help-details\"><summary>I use Linux: useful inventory commands</summary><p>Dortania describes pciutils, dmidecode and inventory tools. Availability and permissions vary by distribution. Consult the manual before installing or running them.</p><pre><code>grep -i \"model name\" /proc/cpuinfo\nlspci -nnk\nlsusb\nlshw -class network\nlshw -class disk -class storage</code></pre><p>Record exact model and IDs. Confirm the codename in the platform guide or manufacturer specifications; do not infer it just from core count or \u201Cv3/v4\u201D.</p>{{5}}{{6}}</details>\n    <div class=\"notice compact\"><strong>Avoid exposing personal data.</strong> Reports may contain identifiers, paths or system data. Review before publishing. Never enter serial, MLB, ROM, UUID, passwords or recovery keys here.</div>\n    </section>", [icon("external"), refLink("hardware"), icon("external"), refLink("hardware"), icon("external"), refLink("hardware"), refLink("platform")]);
}

ON does not confirm support. Kext choices are in <strong>3 \u00B7 Build EFI</strong>; the goal here is to review the data.</p><details class=\"optional-compatibility\"><summary>Sources for checking compatibility</summary>{{20}}{{21}}{{22}}</details>\n    <div class=\"inline-actions\"><button class=\"button\" data-action=\"start-route\">Next step: 2 \u00B7 Prepare BIOS and ACPI {{23}}</button></div>", [icon("shield"), icon("download"), icon("arrow"), gpuSelectionHtml(), macosAssessmentHtml(), componentReviewHtml(), hardwareHelp(), selectField("platform", L("Plataforma", "Platform")), selectField("macos", L("Vers\u00E3o alvo do macOS", "Target macOS version")), selectField("wifi", L("Fam\u00EDlia do Wi-Fi", "Wi-Fi family")), state.profile.mode !== "manual" ? "open" : "", selectField("mode", L("Conte\u00FAdo complementar", "Supplementary content")), sources.platform[1], icon("external"), Object.entries(profileLabels)

rt for later builds. Older versions also require security and application-support review.</p><div class=\"inline-actions\"><a class=\"text-button\" href=\"{{3}}\" target=\"_blank\" rel=\"noreferrer\">Check the screening source {{4}}</a><a class=\"text-button\" href=\"{{5}}\" target=\"_blank\" rel=\"noreferrer\">Tahoe caveats {{6}}</a></div></details></section>", [esc(result.summary), result.rows.map((row) => `<li${state.profile.macos === row.id ? ' class="assessment-target"' : ""}><div><strong>${esc(row.label)}${state.profile.macos === row.id ? L(" \u00B7 seu alvo", " \u00B7 your target") : ""}</strong><span class="assessment-status ${row.status}">${labels[row.status]}</span></div><p>${esc(row.reason)}</p></li>`).join(""), result.notes.map((note) => `<li>${esc(note)}</li>`).join(""), esc(result.source), icon("external"), macosAssessmentSources.tahoe, icon("external")]);
