function filteredAcpiCatalog(query = "") {
    const normalize = (value) => String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    const q = normalize(query.trim());
    return acpiCatalog.filter((item) => !q ||
        normalize([
            item.name,
            item.category,
            item.type,
            item.purpose,
            item.when,
            item.caution,
            item.method,
        ].join(" ")).includes(q));
}
function acpiCatalogRows(query = "") {
    const items = filteredAcpiCatalog(query);

function getRecommendations(profile) {
    const items = [];
    const missing = [];
    const add = (id, title, category, evidence, verify, url, kind = "candidate") => {
        if (!items.some((item) => item.id === id))
            items.push({ id, title, category, evidence, verify, url, kind });
    };
    const text = (key) => String(profile[key] || "").toLowerCase();
    const ethernet = text("ethernet");
    const audio = text("audio");
    const bluetooth = text("bluetooth");
    const storage = text("storage");
    if (profile.macos === "tahoe")
        missing.push(L("Tahoe 26: revise a p\u00E1gina espec\u00EDfica do Dortania antes de montar/atualizar. AppleHDA foi removido; suporte de \u00E1udio, Wi-Fi, SMBIOS e demais componentes deve ser revisto por build. N\u00E3o aplique ajustes de vers\u00F5es anteriores em bloco.", "Tahoe 26: review Dortania's dedicated page before building/updating. AppleHDA was removed; review audio, Wi-Fi, SMBIOS and other component support for the specific build. Do not apply earlier versions' settings in bulk."));
    if (profile.macos === "tahoe" && profile.gpu?.trim())
        missing.push(L("Tahoe / GPU: o Dortania documenta panics de conectores AMD com WhateverGreen. Confira build, GPU e release antes de atualizar; n\u00E3o remova a kext de toda EFI por preven\u00E7\u00E3o.", "Tahoe / GPU: Dortania documents AMD connector panics with WhateverGreen. Check build, GPU and release before updating; do not remove the kext from every EFI preventively."));
    if (/\b(?:PM981|PM991|2200S|PC711|600p)\b/i.test(storage))
        missing.push(L("Armazenamento: o modelo informado tem alertas no Dortania. Confirme o SSD e firmware, mesmo se n\u00E3o for o destino. NVMeFix n\u00E3o garante compatibilidade. Consulte Hardware Limitations \u2192 Storage Support.", "Storage: the reported model has Dortania warnings. Confirm the SSD and firmware even if it is not the destination. NVMeFix does not guarantee compatibility. See Hardware Limitations \u2192 Storage Support."));
    if (profile.wifi === "intel" && profile.macos === "sonoma")

function normalizeTestResults(value) {
    const result = {};
    if (!value || typeof value !== "object" || Array.isArray(value))
        return result;
    for (const { id } of adaptiveTestCatalog) {
        const entry = value[id];
        if (!entry ||
            typeof entry !== "object" ||

            !Object.hasOwn(testStatuses, entry.status))

                ? entry.against
                : "",
        };
    }
    return result;
}
function normalizeVersionRecords(value) {
    const result = {};
    if (!value || typeof value !== "object" || Array.isArray(value))
        return result;
    for (const id of ["opencore", ...assemblyCatalog.map((item) => item.id)]) {
        const entry = value[id];
        if (!entry || typeof entry !== "object" || Array.isArray(entry))
            continue;
        const record = {};
        for (const field of id === "opencore"
            ? ["source", "revision"]

            if (typeof entry[field] === "string" && entry[field].length <= 500)

}
function testContextFingerprint(profile, plan = {}, versions = {}) {
    const records = normalizeVersionRecords(versions);
    const context = JSON.stringify([
        assemblyFingerprint(profile),
        [...(plan.selected || [])].sort().map((id) => [id, records[id] || {}]),
        records.opencore || {},
    ]);
    // Identificador compacto de mudanças locais, não assinatura de segurança.
    let hash = 2166136261;
    for (let i = 0; i < context.length; i++)
        hash = Math.imul(hash ^ context.charCodeAt(i), 16777619) >>> 0;
    return `tests-v1:${context.length}:${hash.toString(16)}`;
}
function testNeedsReview(entry, profile, plan, versions) {

    return (heading(L("ETAPA 3 DE 4 \u00B7 MONTAGEM GUIADA", "STEP 3 OF 4 \u00B7 GUIDED BUILD"), L("Do invent\u00E1rio \u00E0 pasta EFI.", "From inventory to EFI folder."), L("Veja o que considerar para o seu hardware, por que usar, de onde obter e onde copiar. O painel do plano registra somente o que voc\u00EA escolheu.", "See what to consider for your hardware, why to use it, where to obtain it and where to copy it. The plan panel records only your choices."), L.format("<button class=\"button secondary\" data-view=\"profile\">Editar hardware {{0}}</button>", "<button class=\"button secondary\" data-view=\"profile\">Edit hardware {{0}}</button>", [icon("chip")])) + L.format("<div class=\"assembly-mobile-shortcut\"><button class=\"button secondary\" data-action=\"show-plan\">Ver meu plano ({{0}}) {{1}}</button></div>\n    <div class=\"assembly-layout\"><div class=\"assembly-main\">{{2}}\n    <div class=\"notice\"><div><strong>Esta \u00E9 a montagem. A prepara\u00E7\u00E3o fica na etapa 2.</strong><p>Use o invent\u00E1rio revisado e os SSDTs que voc\u00EA preparou. Se ainda faltam backup, BIOS ou dump ACPI, volte \u00E0 prepara\u00E7\u00E3o antes de copiar arquivos.</p><button class=\"text-button\" data-view=\"preparation\">Voltar a 2 \u00B7 Preparar BIOS {{3}}</button></div></div>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.1 \u00B7 OBTER E SEPARAR A BASE</div><h2>Comece pela estrutura do OpenCore.</h2><p>Escolha o pacote de OpenCore conforme a arquitetura do firmware e a edi\u00E7\u00E3o adequada ao diagn\u00F3stico. Em firmware x64 UEFI, o ponto de partida usual \u00E9 a pasta <code>X64/EFI</code>; hardware legado exige o caminho correspondente no Dortania, n\u00E3o uma c\u00F3pia cega.</p>\n    <ol class=\"assembly-instructions\"><li>Extraia o pacote oficial em uma pasta de trabalho separada da EFI funcional.</li><li>Preserve <code>EFI/BOOT/BOOTx64.efi</code> e <code>EFI/OC/OpenCore.efi</code>.</li><li>Separe <code>OpenRuntime.efi</code> do mesmo pacote para <code>EFI/OC/Drivers</code>.</li><li>Copie <code>Docs/Sample.plist</code> para <code>EFI/OC/config.plist</code>. Ele ainda precisa ser configurado.</li><li>Revise Drivers e Tools: n\u00E3o copie tudo. Pastas ACPI e Kexts receber\u00E3o somente os componentes escolhidos e verificados.</li></ol>\n    <div class=\"source-box\">{{4}}{{5}}{{6}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.2 \u00B7 ESCOLHER COM MOTIVO</div><h2>Candidatos ligados ao seu invent\u00E1rio.</h2><p>Marque apenas depois de conferir o modelo e a fonte. Ao incluir um plugin, suas depend\u00EAncias de cat\u00E1logo entram no plano. Alternativas de Wi-Fi e de mapa USB se substituem; a interface avisa, n\u00E3o habilita as duas.</p>\n    {{7}}\n    {{8}}\n    </section>\n    <details class=\"panel assembly-extra\" id=\"assembly-extras\"><summary>Drivers, sensores, mapa USB e escolhas fora das sugest\u00F5es</summary><p>Consulta manual. Aparecer nesta lista n\u00E3o significa necessidade ou suporte. Componentes j\u00E1 selecionados continuam dispon\u00EDveis mesmo se voc\u00EA alterar o hardware.</p>{{9}}</details>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.3 \u00B7 SSDTs E INTEGRA\u00C7\u00C3O ACPI</div><h2>Escolha com evid\u00EAncia, copie e cadastre os SSDTs.</h2><p>A gera\u00E7\u00E3o fica na etapa 2; aqui voc\u00EA integra o resultado \u00E0 EFI. O cat\u00E1logo abaixo explica cada corre\u00E7\u00E3o, sem adicionar arquivos automaticamente. N\u00E3o existe pacote \u201Ctodos os SSDTs\u201D.</p>\n    <ol class=\"assembly-instructions\"><li>Na se\u00E7\u00E3o <strong>ACPI</strong> da p\u00E1gina da sua gera\u00E7\u00E3o, identifique as corre\u00E7\u00F5es e confirme as condi\u00E7\u00F5es no dump final. N\u00E3o use s\u00F3 o nome da placa.</li><li>Confira o fonte <code>.dsl</code>, os caminhos dos dispositivos e o resultado compilado <code>.aml</code>. EC/EC-USBX t\u00EAm estrat\u00E9gias diferentes entre desktop e notebook; preserve o EC real quando necess\u00E1rio. PLUG depende da gera\u00E7\u00E3o e do macOS, n\u00E3o \u00E9 para todo processador.</li><li>Copie somente os AMLs revisados para <code>EFI/OC/ACPI</code>. N\u00E3o copie o DSDT completo nem o fonte DSL como se fosse AML; evite corre\u00E7\u00F5es equivalentes duplicadas.</li><li>Registre os nomes abaixo para inclu\u00ED-los na \u00E1rvore e no backup. Na subetapa 3.4, integre patches/renames associados e confira cada <code>ACPI/Add/Path</code> com <code>Enabled</code> adequado.</li><li>Em <code>ACPI/Patch</code> e <code>ACPI/Delete</code>, confirme alvo, condi\u00E7\u00E3o e necessidade. Um AML dependente de rename pode n\u00E3o funcionar sozinho. Valide o plist e teste no computador-alvo pela m\u00EDdia de recupera\u00E7\u00E3o.</li></ol>\n    <a class=\"source-link\" href=\"{{10}}\" target=\"_blank\" rel=\"noreferrer\">Consultar ACPI da plataforma: {{11}} {{12}}</a>\n    <div class=\"aml-form\"><label class=\"field\"><span>Nome do SSDT revisado</span><input id=\"plan-aml-name\" maxlength=\"100\" placeholder=\"Ex.: SSDT-EC.aml\"></label><button class=\"button secondary\" data-action=\"add-plan-aml\">Adicionar ao plano</button></div><p class=\"field-help\">Somente o nome do arquivo, sem pasta. N\u00E3o adicionar DSDT completo. O nome n\u00E3o valida o conte\u00FAdo.</p>\n    <ul class=\"aml-list\">{{13}}</ul>\n    {{14}}\n    <p>Se o SSDT exige rename ou patch, integre os patches ao plist com PatchMerge e compare antes/depois. Copiar o AML sozinho pode ser insuficiente.</p><div class=\"inline-actions\"><button class=\"text-button\" data-chapter=\"ssdt-gerar\">Como gerar SSDTs</button><button class=\"text-button\" data-chapter=\"patchmerge\">Como usar PatchMerge</button></div>{{15}}</section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.4 \u00B7 FAZER O PLIST CORRESPONDER \u00C0 PASTA</div><h2>Integre os patches e cadastre os arquivos.</h2><ol class=\"assembly-instructions\"><li>Use o <code>config.plist</code> criado a partir de <code>Docs/Sample.plist</code> na subetapa 3.1.</li><li>Se os SSDTs da prepara\u00E7\u00E3o exigem patches, fa\u00E7a backup do plist, aplique PatchMerge e compare a c\u00F3pia resultante antes de substituir. Confira <code>ACPI/Patch</code> e <code>ACPI/Delete</code>; n\u00E3o duplique uma mesclagem anterior.</li><li>Abra o plist revisado no ProperTree. Use <code>Command/Ctrl + Shift + R</code> e selecione a pasta <code>EFI/OC</code>.</li><li>Revise <code>Kernel/Add</code>, <code>ACPI/Add</code>, <code>UEFI/Drivers</code> e ferramentas. Confira plugins e execut\u00E1veis reais; injectors plist-only n\u00E3o possuem bin\u00E1rio.</li><li>N\u00E3o confunda Snapshot com configura\u00E7\u00E3o autom\u00E1tica de quirks. Ele sincroniza listas, n\u00E3o valida o hardware.</li></ol>\n    <div class=\"source-box\">{{16}}{{17}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.5 \u00B7 CONFIG.PLIST, SMBIOS E USB</div><h2>Configure a plataforma, o modelo e as portas.</h2><p>Leia os blocos abaixo sem sair da montagem. O conte\u00FAdo \u00E9 o mesmo da consulta; os checklists e notas permanecem nos artigos, sem criar tarefas duplicadas.</p>\n    <a class=\"source-link\" href=\"{{18}}\" target=\"_blank\" rel=\"noreferrer\">{{19}} {{20}}</a>{{21}}\n    <ul><li><strong>CPU:</strong> {{22}}. Conferir Emulate/quirks da gera\u00E7\u00E3o; n\u00E3o gerar CPUID a partir do nome.</li><li><strong>GPU:</strong> {{23}}. Confirmar acelera\u00E7\u00E3o, propriedades e conectores; n\u00E3o inferir framebuffer ou argumentos.</li><li><strong>\u00C1udio:</strong> {{24}}. Conferir codec e layouts; n\u00E3o escolher alcid por aproxima\u00E7\u00E3o.</li><li><strong>SMBIOS:</strong> {{25}}. Gerar identidade individual fora deste guia e n\u00E3o public\u00E1-la.</li><li><strong>USB:</strong> mapear portas e testar. USBX/USB Reset n\u00E3o s\u00E3o o mapa.</li></ul>\n    {{26}}\n    {{27}}\n    {{28}}\n    {{29}}\n    <div class=\"inline-actions\"><button class=\"text-button\" data-view=\"profile\">Registrar ou editar o modelo SMBIOS em Meu hardware {{30}}</button></div>\n    {{31}}\n    <div class=\"source-box\"><strong>Arquivos do mapa USB no planejador</strong><p>XhciPortLimit \u00E9 um ajuste do plist, n\u00E3o uma kext. No m\u00E9todo USBToolBox com depend\u00EAncia, escolha USBToolBox.kext + seu UTBMap.kext gerado; USBMap \u00E9 uma alternativa. Nada \u00E9 selecionado automaticamente.</p><button class=\"text-button\" data-action=\"show-usb-options\">Mostrar op\u00E7\u00F5es de mapa USB {{32}}</button>{{33}}{{34}}</div>\n    </section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.6 \u00B7 FECHAR O PLANO DE MONTAGEM</div><h2>O que voc\u00EA conferiu nesta montagem?</h2><p>As caixas abaixo s\u00E3o declara\u00E7\u00F5es manuais, n\u00E3o verifica\u00E7\u00F5es autom\u00E1ticas. A valida\u00E7\u00E3o com ocvalidate e o teste de boot ficam na etapa 4.</p>{{35}}\n    <div class=\"notice compact\">O plano n\u00E3o \u00E9 uma EFI gerada. Mesmo com as caixas marcadas, os arquivos ainda precisam ser validados e testados.</div><div class=\"inline-actions\"><button class=\"button\" data-view=\"installation\">Pr\u00F3xima etapa: 4 \u00B7 Instalar e testar {{36}}</button></div></section>\n    </div>{{37}}</div>", "<div class=\"assembly-mobile-shortcut\"><button class=\"button secondary\" data-action=\"show-plan\">View my plan ({{0}}) {{1}}</button></div>\n    <div class=\"assembly-layout\"><div class=\"assembly-main\">{{2}}\n    <div class=\"notice\"><div><strong>This is the build. Preparation is step 2.</strong><p>Use the reviewed inventory and prepared SSDTs. If backup, BIOS or ACPI dump are still missing, return to preparation before copying files.</p><button class=\"text-button\" data-view=\"preparation\">Back to 2 \u00B7 Prepare BIOS {{3}}</button></div></div>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.1 \u00B7 OBTAIN AND PREPARE THE BASE</div><h2>Start with the OpenCore structure.</h2><p>Choose the OpenCore package according to firmware architecture and the edition appropriate for diagnosis. On x64 UEFI firmware, the usual starting point is <code>X64/EFI</code>; legacy hardware requires Dortania's matching path, not a blind copy.</p>\n    <ol class=\"assembly-instructions\"><li>Extract the official package into a working folder separate from the working EFI.</li><li>Keep <code>EFI/BOOT/BOOTx64.efi</code> and <code>EFI/OC/OpenCore.efi</code>.</li><li>Take <code>OpenRuntime.efi</code> from the same package and place it in <code>EFI/OC/Drivers</code>.</li><li>Copy <code>Docs/Sample.plist</code> to <code>EFI/OC/config.plist</code>. It still needs configuration.</li><li>Review Drivers and Tools: do not copy everything. ACPI and Kexts folders receive only chosen, verified components.</li></ol>\n    <div class=\"source-box\">{{4}}{{5}}{{6}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.2 \u00B7 CHOOSE WITH A REASON</div><h2>Candidates linked to your inventory.</h2><p>Select only after checking the model and source. Adding a plugin adds its catalog dependencies to the plan. Wi-Fi and USB-map alternatives replace one another; the interface warns rather than enabling both.</p>\n    {{7}}\n    {{8}}\n    </section>\n    <details class=\"panel assembly-extra\" id=\"assembly-extras\"><summary>Drivers, sensors, USB maps and choices outside the suggestions</summary><p>Manual reference. Being listed does not establish necessity or support. Selected components remain available even if hardware changes.</p>{{9}}</details>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.3 \u00B7 SSDTs AND ACPI INTEGRATION</div><h2>Choose with evidence, copy and register SSDTs.</h2><p>Generation happens in step 2; here you integrate the result into the EFI. The catalog below explains each fix without adding files automatically. There is no \u201Call SSDTs\u201D package.</p>\n    <ol class=\"assembly-instructions\"><li>In the <strong>ACPI</strong> section of your generation's page, identify fixes and confirm their conditions in the final dump. Do not rely only on the board's name.</li><li>Check the source <code>.dsl</code>, device paths and the compiled result <code>.aml</code>. EC/EC-USBX strategies differ between desktops and laptops; preserve the real EC when necessary. PLUG depends on generation and macOS, not every processor.</li><li>Copy only reviewed AMLs to <code>EFI/OC/ACPI</code>. Do not copy the full DSDT or DSL source as if it were AML; avoid duplicate equivalent fixes.</li><li>Record names below for the tree and backup. In section 3.4, integrate associated patches/renames and check each <code>ACPI/Add/Path</code> with <code>Enabled</code> set appropriately.</li><li>Under <code>ACPI/Patch</code> and <code>ACPI/Delete</code>, confirm target, condition and necessity. An AML dependent on a rename may not work alone. Validate the plist and test on the target computer using recovery media.</li></ol>\n    <a class=\"source-link\" href=\"{{10}}\" target=\"_blank\" rel=\"noreferrer\">Consult platform ACPI: {{11}} {{12}}</a>\n    <div class=\"aml-form\"><label class=\"field\"><span>Reviewed SSDT filename</span><input id=\"plan-aml-name\" maxlength=\"100\" placeholder=\"E.g. SSDT-EC.aml\"></label><button class=\"button secondary\" data-action=\"add-plan-aml\">Add to plan</button></div><p class=\"field-help\">Filename only, without a folder. Do not add the entire DSDT. The name does not validate the content.</p>\n    <ul class=\"aml-list\">{{13}}</ul>\n    {{14}}\n    <p>If an SSDT requires a rename or patch, integrate patches into the plist with PatchMerge and compare before/after. Copying the AML alone may be insufficient.</p><div class=\"inline-actions\"><button class=\"text-button\" data-chapter=\"ssdt-gerar\">How to generate SSDTs</button><button class=\"text-button\" data-chapter=\"patchmerge\">How to use PatchMerge</button></div>{{15}}</section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.4 \u00B7 MATCH THE PLIST TO THE FOLDER</div><h2>Integrate patches and register files.</h2><ol class=\"assembly-instructions\"><li>Use the <code>config.plist</code> created from <code>Docs/Sample.plist</code> in section 3.1.</li><li>If the preparation SSDTs require patches, back up the plist, apply PatchMerge and compare the resulting copy before replacing it. Check <code>ACPI/Patch</code> and <code>ACPI/Delete</code>; do not duplicate a previous merge.</li><li>Open the reviewed plist in ProperTree. Use <code>Command/Ctrl + Shift + R</code> and select the folder <code>EFI/OC</code>.</li><li>Review <code>Kernel/Add</code>, <code>ACPI/Add</code>, <code>UEFI/Drivers</code> and tools. Check actual plugins and executables; plist-only injectors have no binary.</li><li>Do not confuse Snapshot with automatic quirk configuration. It synchronizes lists, not hardware validity.</li></ol>\n    <div class=\"source-box\">{{16}}{{17}}</div></section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.5 \u00B7 CONFIG.PLIST, SMBIOS AND USB</div><h2>Configure the platform, model and ports.</h2><p>Read the sections below without leaving the build. Content is shared with the reference; checklists and notes stay in the articles without duplicating tasks.</p>\n    <a class=\"source-link\" href=\"{{18}}\" target=\"_blank\" rel=\"noreferrer\">{{19}} {{20}}</a>{{21}}\n    <ul><li><strong>CPU:</strong> {{22}}. Check generation-specific Emulate/quirks; do not generate CPUID from the name.</li><li><strong>GPU:</strong> {{23}}. Confirm acceleration, properties and connectors; do not infer framebuffer or arguments.</li><li><strong>Audio:</strong> {{24}}. Check codec and layouts; do not approximate alcid.</li><li><strong>SMBIOS:</strong> {{25}}. Generate an individual identity outside this guide and do not publish it.</li><li><strong>USB:</strong> map ports and test. USBX/USB Reset are not the map.</li></ul>\n    {{26}}\n    {{27}}\n    {{28}}\n    {{29}}\n    <div class=\"inline-actions\"><button class=\"text-button\" data-view=\"profile\">Record or edit the SMBIOS model in My hardware {{30}}</button></div>\n    {{31}}\n    <div class=\"source-box\"><strong>USB map files in the planner</strong><p>XhciPortLimit is a plist setting, not a kext. For the USBToolBox-dependent method, choose USBToolBox.kext + your generated UTBMap.kext; USBMap is an alternative. Nothing is selected automatically.</p><button class=\"text-button\" data-action=\"show-usb-options\">Show USB mapping options {{32}}</button>{{33}}{{34}}</div>\n    </section>\n    <section class=\"panel assembly-step\"><div class=\"assembly-step-label\">3.6 \u00B7 COMPLETE THE BUILD PLAN</div><h2>What did you verify in this build?</h2><p>The boxes below are manual declarations, not automatic checks. ocvalidate and boot testing are in step 4.</p>{{35}}\n    <div class=\"notice compact\">The plan is not a generated EFI. Even with boxes checked, files still need validation and testing.</div><div class=\"inline-actions\"><button class=\"button\" data-view=\"installation\">Next step: 4 \u00B7 Install and test {{36}}</button></div></section>\n    </div>{{37}}</div>", [result.selected.length, icon("arrow"), assemblyHardwareSummary(), icon("arrow"), refLink("baseefi"), refLink("oc"), refLink("config"), suggested.length
            ? grouped
                .map((category) => `<section class="assembly-category"><h3>${esc(category)}</h3>${suggested
                .filter((item) => item.category === category)
                .map((item) => assemblyChoiceCard(item, assemblyEvidence(item)))
                .join("")}</section>`)
                .join("")
            : L("<div class=\"empty-state\"><h3>Primeiro identifique seu hardware.</h3><p>Nenhum candidato espec\u00EDfico foi reconhecido. Preencha o invent\u00E1rio ou consulte a fonte do controlador; n\u00E3o vamos inventar um driver.</p><button class=\"button secondary\" data-view=\"profile\">Preencher hardware</button></div>", "<div class=\"empty-state\"><h3>Identify your hardware first.</h3><p>No specific candidate recognized. Complete the inventory or consult the controller's source; we will not invent a driver.</p><button class=\"button secondary\" data-view=\"profile\">Enter hardware</button></div>"), result.recommendations.items
            .filter((rec) => !assemblyCatalog.some((item) => item.candidate === rec.id))
            .map((rec) => L.format("<div class=\"notice compact\"><div><strong>{{0}}</strong><p>{{1}}</p><a href=\"{{2}}\" target=\"_blank\" rel=\"noreferrer\">Investigar a fonte antes de escolher um pacote</a></div></div>", "<div class=\"notice compact\"><div><strong>{{0}}</strong><p>{{1}}</p><a href=\"{{2}}\" target=\"_blank\" rel=\"noreferrer\">Investigate the source before choosing a package</a></div></div>", [esc(rec.title), esc(rec.verify), esc(rec.url)]))
            .join(""), other.map((item) => assemblyChoiceCard(item)).join(""), esc(guide.url), esc(guide.label), icon("external"), state.plan.amls.map((name) => L.format("<li><code>EFI/OC/ACPI/{{0}}</code><button data-plan-aml-remove=\"{{1}}\" aria-label=\"Retirar {{2}}\">Retirar</button></li>", "<li><code>EFI/OC/ACPI/{{0}}</code><button data-plan-aml-remove=\"{{1}}\" aria-label=\"Remove {{2}}\">Remove</button></li>", [esc(name), esc(name), esc(name)])).join(""), acpiCatalogSection("assembly"), refLink("easy"), refLink("proper"), refLink("config"), esc(guide.url), icon("external"), esc(guide.label), !guide.matched
            ? L("<p class=\"profile-warning\">Ainda n\u00E3o localizamos um caminho exato para o codinome informado. Use o \u00EDndice e confirme a gera\u00E7\u00E3o antes de aplicar valores.</p>", "<p class=\"profile-warning\">No exact path was found for the reported codename. Use the index and confirm the generation before applying values.</p>") : "", esc(state.profile.cpu || L("n\u00E3o informada", "not provided")), esc(state.profile.gpu || L("n\u00E3o informada", "not provided")), esc(state.profile.audio || L("n\u00E3o informado", "not provided")), esc(state.profile.smbios || L("modelo ainda a escolher", "model not yet chosen")), state.profile.platform === "amd"
            ? L("<p class=\"notice\">AMD: obtenha e ajuste os patches AMD Vanilla conforme a documenta\u00E7\u00E3o. Esta lista n\u00E3o produz patches de kernel.</p>", "<p class=\"notice\">AMD: obtain and adjust AMD Vanilla patches according to the documentation. This list does not produce kernel patches.</p>") : "", assemblyReading("config-secoes", L("Config.plist \u00B7 da base \u00E0s oito se\u00E7\u00F5es", "Config.plist \u00B7 from the base to the eight sections"), true), assemblyReading("cpu", L("CPU / Xeon \u00B7 spoof, XCPM, clocks e ForceBoost", "CPU / Xeon \u00B7 spoofing, XCPM, clocks and ForceBoost")), assemblyReading("smbios", L("SMBIOS \u00B7 escolher e configurar o modelo", "SMBIOS \u00B7 choosing and configuring the model")), icon("arrow"), assemblyReading("usb", L("USB \u00B7 mapear HS/SS, tipos e conferir XhciPortLimit", "USB \u00B7 mapping HS/SS, types and checking XhciPortLimit")), icon("arrow"), refLink("usbtool"), refLink("usbmap"), assemblySteps
            .filter(([id]) => id !== "validate")
            .map(([id, label, description]) => `<label class="assembly-check"><input type="checkbox" data-plan-check="${id}" ${state.plan.checks[id] ? "checked" : ""}><span><strong>${esc(label)}</strong><small>${esc(description)}</small></span></label>`)
            .join(""), icon("arrow"), assemblySummary()]));
}
function showExpandedTree() {
    const dialog = document.getElementById("tree-preview");
    dialog.innerHTML = L.format("<header class=\"tree-preview-header\"><div><span class=\"eyebrow\">LEITURA AMPLIADA \u00B7 PLANO, N\u00C3O ARQUIVOS GERADOS</span><h2 id=\"tree-preview-title\">Estrutura planejada da EFI</h2></div><button class=\"button secondary small\" data-action=\"close-tree\">Fechar</button></header><div class=\"tree-preview-content\"><p>As linhas longas quebram automaticamente. A estrutura reflete suas escolhas e nomes de AML; o guia n\u00E3o conferiu o conte\u00FAdo do seu disco.</p><pre class=\"plan-tree expanded-tree\"><code>{{0}}</code></pre></div>", "<header class=\"tree-preview-header\"><div><span class=\"eyebrow\">EXPANDED VIEW \u00B7 PLAN, NOT GENERATED FILES</span><h2 id=\"tree-preview-title\">Planned EFI structure</h2></div><button class=\"button secondary small\" data-action=\"close-tree\">Close</button></header><div class=\"tree-preview-content\"><p>Long lines wrap automatically. The structure reflects your choices and AML names; the guide has not checked disk contents.</p><pre class=\"plan-tree expanded-tree\"><code>{{0}}</code></pre></div>", [esc(assemblyTree(state.plan))]);
    dialog.showModal();
}
function refreshAssemblyView(focusSelector) {
    const scroll = window.scrollY;
    const opened = [...document.querySelectorAll("details[id][open]")].map((item) => item.id);
    renderMain();
    opened.forEach((id) => {
        const el = document.getElementById(id);
        if (el)
            el.open = true;
    });
    if (focusSelector)
        document.querySelector(focusSelector)?.focus({ preventScroll: true });
    window.scrollTo({ top: scroll, behavior: "instant" });
}

const PROJECTS_KEY = "opencore-interativo-projetos-v1";

function newProjectRecord(name, snapshot, selected = []) {

function initializeProjects() {

        if (raw) loaded = JSON.parse(raw);

    if (loaded && Array.isArray(loaded.projects) && loaded.projects.length && loaded.projects.length <= 40) {
        const valid = loaded.projects.filter(p => p && typeof p.id === "string" && typeof p.name === "string" && p.state && typeof p.state === "object").slice(0, 40);
        if (valid.length) {
            projectsStore = {activeId: valid.some(p => p.id === loaded.activeId) ? loaded.activeId : valid[0].id, projects: valid};
            const active = activeProject();
            try { state = cleanState(active.state); } catch (_) { active.state = structuredClone(state); }
            return;

// Raiz única do pacote portátil: selecionada pelo usuário, nunca inferida do caminho

let guideRootHandle = null;
let guideFolderStatus = "disconnected";
let guideConnectionReady = false;
const GUIDE_IDB = "opencore-interativo-pasta-v1";
const GUIDE_HANDLE_KEY = "raiz";
function guideHandleDb() {
  return new Promise((resolve,reject)=>{
    if (!window.indexedDB) { reject(Error("IndexedDB indisponível")); return; }
    const req=indexedDB.open(GUIDE_IDB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore("handles");
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function guideRememberHandle(handle) {
  const db=await guideHandleDb();
  try { await new Promise((resolve,reject)=>{
    const tx=db.transaction("handles","readwrite");
    tx.objectStore("handles").put(handle,GUIDE_HANDLE_KEY);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  }); } finally {db.close();}
}
async function guideRecallHandle() {
  const db=await guideHandleDb();
  try {return await new Promise((resolve,reject)=>{
    const req=db.transaction("handles","readonly").objectStore("handles").get(GUIDE_HANDLE_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });} finally{db.close();}
}
async function guidePermission(handle, request=false) {
  const opts={mode:"readwrite"};
  let state="prompt";
  if(typeof handle.queryPermission==="function") state=await handle.queryPermission(opts);
  if(state!=="granted" && request && typeof handle.requestPermission==="function") state=await handle.requestPermission(opts);
  return state;
}

let projectFolderHandle = null;
let projectFolderFiles = new Set();
let projectFolderWriteQueue = Promise.resolve();
let projectFolderTimer = null;
let projectFolderStatus = "disconnected";
const PROJECT_FOLDER_INDEX = "projetos-index.json";
function projectFileName(p) {
    const readable = p.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
       .replace(/[^a-zA-Z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 45) || "Computador";
    const suffix = String(p.id).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 58);
    return `${readable}--${suffix}.json`;
}
function projectFilePayload(p) {
    return {type:"opencore-project",schema:1,id:p.id,name:p.name,
       createdAt:p.createdAt,updatedAt:p.updatedAt,state:p.state,ocdbChoices:p.ocdbChoices || []};
}
function projectFromDisk(data) {
    if (!data || data.type !== "opencore-project" || data.schema !== 1 ||
        typeof data.name !== "string" || typeof data.id !== "string" || data.id.length > 100)
        throw Error(L("Projeto da pasta com formato inválido.","Invalid project found in folder."));
    const stateData = cleanState(data.state);
    const choices = Array.isArray(data.ocdbChoices) ? [...new Set(data.ocdbChoices.filter(x =>
        typeof x === "string" && /^(SSDT|KEXT|DRIVER):[a-z0-9_-]{1,100}$/i.test(x)))].slice(0,250) : [];
    return {id:data.id,name:sanitizedProjectName(data.name) || "Computador",
       createdAt:typeof data.createdAt === "string" ? data.createdAt : new Date().toISOString(),
       updatedAt:typeof data.updatedAt === "string" ? data.updatedAt : new Date().toISOString(),
       state:stateData,ocdbChoices:choices};
}
async function readFolderProjects(dir) {
    const files = new Set(), loaded = [];
    let index = null;
    try {
      const handle = await dir.getFileHandle(PROJECT_FOLDER_INDEX);
      const file = await handle.getFile();
      if (file.size > 500000) throw Error("Índice de projetos excessivamente grande.");
      index = JSON.parse(await file.text());
      if (index.type !== "opencore-project-index" || index.schema !== 1 || !Array.isArray(index.entries))
        throw Error(L("Índice da pasta inválido.", "Invalid folder index."));
    } catch(e) { if (e.name !== "NotFoundError") throw e; }
    if (!index) return {files,loaded};
    if (index.entries.length > 40) throw Error(L("A pasta contém mais de 40 projetos.","Folder contains over 40 projects."));
    for (const record of index.entries) {
       const name = record?.file;
       if (typeof name !== "string" || !/^[a-zA-Z0-9_-]+\.json$/.test(name) || name === PROJECT_FOLDER_INDEX)
         throw Error(L("Nome de arquivo inválido no índice.","Invalid filename in project index."));
       const handle = await dir.getFileHandle(name);
       const file = await handle.getFile();
       if (file.size > 1500000) throw Error(L("Arquivo de projeto excede 1,5 MB.","Project file exceeds 1.5 MB."));
       loaded.push(projectFromDisk(JSON.parse(await file.text())));
       files.add(name);
    }
    if (new Set(loaded.map(p=>p.id)).size !== loaded.length) throw Error(L("IDs de projeto duplicados na pasta.","Duplicate project IDs in folder."));
    return {files,loaded};
}
async function writeTextInFolder(dir,name,content) {
    const handle = await dir.getFileHandle(name,{create:true});
    const writer = await handle.createWritable();
    try { await writer.write(content); await writer.close(); }
    catch(error) { try { await writer.abort(); } catch(_) {} throw error; }
}
async function writeProjectsToFolder() {
    if (!projectFolderHandle) return;
    const dir = projectFolderHandle;
    // Snapshot is immutable during this write; save updates arriving meanwhile
    // are serialized and will trigger a later write.
    const snapshot = structuredClone(projectsStore.projects);
    const names = new Set();
    for (const project of snapshot) {
        const name = projectFileName(project);
        names.add(name);
        await writeTextInFolder(dir,name,JSON.stringify(projectFilePayload(project),null,2));
    }
    const index = {type:"opencore-project-index",schema:1,
       description:"Arquivos de projetos do OpenCore Interativo. Mantenha o índice junto com os JSONs.",
       entries:snapshot.map(p=>({id:p.id,file:projectFileName(p)}))};
    await writeTextInFolder(dir,PROJECT_FOLDER_INDEX,JSON.stringify(index,null,2));
    // Remove only filenames explicitly tracked by our own previous index.
    // Never remove arbitrary files from the user's chosen directory.
    for (const oldName of projectFolderFiles) if (!names.has(oldName)) {
        try { await dir.removeEntry(oldName); } catch (_) {}
    }
    projectFolderFiles = names;
    projectFolderStatus = "saved";
    const indicator = document.querySelector('[data-project-folder-status]');
    if (indicator) indicator.textContent = L("Pasta conectada — alterações salvas.","Folder connected — changes saved.");
}
function scheduleProjectFolderSave() {

    projectFolderStatus = "pending";

       projectFolderWriteQueue = projectFolderWriteQueue.then(async()=>{
           if (!projectFolderHandle) return;
           try {
              const perm = await projectFolderHandle.queryPermission({mode:"readwrite"});
              if (perm !== "granted") { projectFolderStatus="permission"; return; }
              captureActiveProject();
              await writeProjectsToFolder();
           } catch(e) {
              projectFolderStatus = "error";
              toast(L("Não foi possível salvar na pasta. Exporte um backup JSON. ","Could not save to folder. Export a JSON backup. ")+(e.message||""));
           }
       });
    },500);
}
async function readGuideDatabase(root) {
    const dbDir=await root.getDirectoryHandle("Banco-de-Dados");
    const dbHandle=await dbDir.getFileHandle("database.ocdb");
    const file=await dbHandle.getFile();
    if(file.size>600000)throw Error(L("database.ocdb excede 600 KB.","database.ocdb exceeds 600 KB."));

}
async function useGuideRoot(root, requestPermission=false) {
    guideFolderStatus="loading";
    try {
        const perm=await guidePermission(root,requestPermission);
        if(perm!=="granted"){
            guideFolderStatus="permission";
            guideConnectionReady=false;
            renderMain();return false;
        }
        // All reads succeed BEFORE changing the active project or unlocking navigation.
        const catalog=await readGuideDatabase(root);
        const dir=await root.getDirectoryHandle("Projetos",{create:true});
        const incoming=await readFolderProjects(dir);
        captureActiveProject();
        if(incoming.loaded.length){
            // Pasta é a origem autoritativa, sem mescla silenciosa de outros PCs.
            const previousActive=projectsStore.activeId;
            projectsStore={activeId:incoming.loaded.some(p=>p.id===previousActive)?previousActive:incoming.loaded[0].id,
                           projects:incoming.loaded};
            const active=activeProject();
            state=cleanState(active.state);
            ocdbSelected=new Set(active.ocdbChoices||[]);
        }
        // No primeiro uso, projetos existentes do navegador são migrados para a pasta vazia.
        ocdbRecords=catalog.entries;
        ocdbName=catalog.name;
        ocdbSelected=new Set([...ocdbSelected].filter(id=>ocdbRecords.some(r=>r.type+":"+r.id===id)));
        guideRootHandle=root;
        projectFolderHandle=dir;
        projectFolderFiles=incoming.files;
        guideConnectionReady=true;
        guideFolderStatus="connected";
        try{await guideRememberHandle(root);}catch(e){console.warn("Não foi possível lembrar pasta:",e);}
        persistProjects();
        await writeProjectsToFolder();
        if(view!=="overview")view="overview";
        renderMain();
        toast(L("Pasta sincronizada: banco OCDB e projetos disponíveis.","Folder synced: OCDB database and projects available."));
        return true;
    }catch(error){
        guideFolderStatus="error";
        guideConnectionReady=false;
        projectFolderHandle=null;
        console.error("Falha ao abrir pacote OpenCore:",error);
        renderMain();
        toast((error.message||L("Falha ao conectar pasta.","Folder connection failed.")));
        return false;
    }

function parseOcdb(raw){
  if(typeof raw!=="string" || raw.length>600000)throw Error(L("Banco muito grande (máximo 600 mil caracteres).","Database too large (600k characters maximum)."));
  const lines=raw.replace(/^\uFEFF/,"").split(/\r?\n/), found=[];
  let current=null;
  const allowed=new Set(["name","description_pt","description_en","function_pt","function_en","when_pt","when_en","url","requirement","platform","cpu_vendor","requirement_note_pt","requirement_note_en","generation_codes","generation_note_pt","generation_note_en","guide_context_pt","guide_context_en","guide_check_pt","guide_check_en","guide_avoid_pt","guide_avoid_en","guide_steps_pt","guide_steps_en","guide_example_pt","guide_example_en"]);
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line || line.startsWith("#"))continue;
    const m=line.match(/^\[(SSDT|KEXT|DRIVER):([a-z0-9_-]+)\]$/i);
    if(m){ current={type:m[1].toUpperCase(),id:m[2].toLowerCase()};found.push(current);continue; }
    if(line.startsWith("["))throw Error(L("Cabeçalho inválido na linha ","Invalid header on line ")+(i+1)+": "+line);
    if(!current)throw Error(L("Linha ","Line ")+(i+1)+": "+L("esperado [SSDT:id], [KEXT:id] ou [DRIVER:id].","expected [SSDT:id], [KEXT:id] or [DRIVER:id]."));
    const eq=line.indexOf("=");if(eq<0)throw Error(L("Linha ","Line ")+(i+1)+": "+L("esperado chave = valor.","expected key = value."));
    const key=line.slice(0,eq).trim().toLowerCase(),value=line.slice(eq+1).trim();
    if(!allowed.has(key))throw Error(L("Campo desconhecido na linha ","Unknown field on line ")+(i+1)+": "+key);
    if(value.length>1800)throw Error(L("Campo muito extenso na linha ","Field too long on line ")+(i+1));
    if(Object.hasOwn(current,key))throw Error(L("Campo duplicado na linha ","Duplicate field on line ")+(i+1));
    current[key]=value;
  }
  const ids=new Set();
  for(const item of found){
    const unique=item.type+":"+item.id;
    if(ids.has(unique))throw Error(L("ID duplicado: ","Duplicate ID: ")+unique);ids.add(unique);
    if(!item.name || !item.description_pt)throw Error(L("Registro incompleto: ","Incomplete record: ")+unique);
    // A ausencia dos novos campos mantem compatibilidade com OCDB antigos.
    item.requirement=item.requirement||"conditional";
    item.platform=item.platform||"all";
    item.cpu_vendor=item.cpu_vendor||"all";
    for(const [field,choices] of Object.entries({requirement:["required","conditional","optional"],platform:["all","desktop","laptop"],cpu_vendor:["all","intel","amd"]})){
      item[field]=item[field].toLowerCase();
      if(!choices.includes(item[field]))throw Error(L("Valor invalido no campo ","Invalid value in field ")+field+" ("+unique+"): "+item[field]);
    }

    if(item.url && !/^https:\/\/[^\s]+$/i.test(item.url))throw Error(L("URL HTTPS inválida: ","Invalid HTTPS URL: ")+unique);
    if(item.type==="SSDT" && !validAmlName(item.name))throw Error(L("Nome AML inválido: ","Invalid AML name: ")+item.name);
    if(item.type==="KEXT" && !/^[a-z0-9._-]+\.kext$/i.test(item.name))throw Error(L("Nome de Kext inválido: ","Invalid Kext name: ")+item.name);
    if(item.type==="DRIVER" && !/^[a-z0-9._-]+\.efi$/i.test(item.name))throw Error(L("Nome de Driver inválido: ","Invalid Driver name: ")+item.name);
  }
  if(!found.length)throw Error(L("O arquivo não contém registros OCDB.","The file has no OCDB records."));
  if(found.length>150)throw Error(L("Máximo de 150 registros.","Maximum 150 records."));
  return found;
}

 return `<section class="panel"><div class="ocdb-import"><div><span class="eyebrow">OCDB · ${type}</span><h2>${L("Componentes do banco de dados","Database components")}</h2><p>${records.length} ${L("registros encontrados em","records found in")} ${esc(ocdbName)}</p></div></div>${ocdbFilterControls(type,records.length,visible.length)}${visible.length?`<div class="ocdb-grid">${cards}</div>`:`<div class="ocdb-empty">${L("Nenhum registro corresponde aos filtros. Tente alterar os filtros.","No records match the filters. Try changing the filters.")}</div>`}</section>`;

function updateStats() {
    const s = stats();
    const counter = document.querySelector(".nav-counter");
    document
        .querySelectorAll("[data-plan-count]")
        .forEach((el) => (el.textContent = state.plan.selected.length));
    if (counter)
        counter.textContent = activeChapters().length;
    document
        .querySelectorAll("[data-percent]")
        .forEach((el) => (el.textContent = s.percent + "%"));
    document
        .querySelectorAll("[data-count]")
        .forEach((el) => (el.textContent = L.format("{{0}} de {{1}} tarefas aplic\u00E1veis", "{{0}} of {{1}} applicable tasks", [s.done, s.total])));
    document
        .querySelectorAll("[data-progress]")
        .forEach((el) => (el.value = s.percent));
    document
        .querySelectorAll("[data-critical]")
        .forEach((el) => (el.textContent = s.critical));
    document
        .querySelectorAll("[data-post]")
        .forEach((el) => (el.textContent = s.post));
    document.querySelectorAll("[data-chaptercount]").forEach((el) => {
        const c = chapters.find((c) => c.id === el.dataset.chaptercount);
        const st = stats([c]);
        el.textContent = `${st.done}/${st.total}`;
    });
}
function updateProfileWarning() {
    const el = document.getElementById("profile-warning");
    if (!el)
        return;

function downloadFile(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Export the current planned EFI tree as a single UTF-8 TXT file.
   Only component names and directory layout are exported; no binaries, AMLs,
   Kext bundles or config.plist are created or validated. */
function efiTemplateSelections() {
    const plan = normalizeAssemblyPlan(state.plan);
    const legacy = plan.selected.map(id => assemblyCatalog.find(x => x.id === id)).filter(Boolean);
    const pull = (folder, type) => [
        ...legacy.filter(x => x.folder === folder).map(x => x.file),
        ...ocdbRecords.filter(x => x.type === type && ocdbSelected.has(type + ':' + x.id)).map(x => x.name)
    ];
    const unique = entries => [...new Map(entries.filter(Boolean).map(x => [x.toLowerCase(), x])).values()].sort((a,b)=>a.localeCompare(b));
    return {
       acpi: unique([...plan.amls, ...ocdbRecords.filter(x => x.type === 'SSDT' && ocdbSelected.has('SSDT:' + x.id)).map(x=>x.name)]),
       kexts: unique(pull('Kexts', 'KEXT')),
       drivers: unique(pull('Drivers', 'DRIVER'))
    };
}

    ] : [

        "",
        "WARNING: This is a text-only outline, NOT a bootable EFI.",

    const output = [...header, assemblyTree(state.plan), ""].join("\n");

        save();
        navigate("overview");
        toast(L("Projeto local reiniciado.", "Local project reset."));
    }
    if (action === "expand")
        document.querySelectorAll("details.chapter").forEach((d) => (d.open = true));
    if (action === "collapse")
        document
            .querySelectorAll("details.chapter")
            .forEach((d) => (d.open = false));
    if (action === "clear-filters") {
        query = "";
        taskFilter = "all";
        groupFilter = "all";
        renderMain();
    }
});
guideListen("input", (e) => {
    const el = e.target;

        updateReviewPanel("adaptive-tests", adaptiveTestsHtml);
    }
    if (el.dataset.note) {
        state.notes[el.dataset.note] = el.value;
        save();

    if (el.id === "guide-search") {

});
guideListen("change", async (e) => {
    const el = e.target;
    if(el.dataset.ocdbFilter){ocdbFilters[el.dataset.ocdbFilter]=el.value;renderMain();return;}
    if(el.hasAttribute("data-ocdb-hardware")){ocdbFilters.hardware=el.checked;renderMain();return;}
    if (el.dataset.testStatus &&
        adaptiveTestCatalog.some((item) => item.id === el.dataset.testStatus) &&
        Object.hasOwn(testStatuses, el.value)) {
        const id = el.dataset.testStatus;
        state.testResults[id] = {
            status: el.value,
            evidence: state.testResults[id]?.evidence || "",
            against: testContextFingerprint(state.profile, state.plan, state.versions),
        };
        save();
        updateReviewPanel("adaptive-tests", adaptiveTestsHtml);
        return;
    }
    if(el.dataset.ocdbChoice){
      const item=ocdbRecords.find(x=>x.type+":"+x.id===el.dataset.ocdbChoice);
      if(!item)return;
      if(item.type==="SSDT"){
        if(el.checked && !state.plan.amls.includes(item.name))state.plan.amls.push(item.name);
        if(!el.checked)state.plan.amls=state.plan.amls.filter(name=>name!==item.name);
        save();renderMain();return;
      }
      const folder=item.type==="DRIVER"?"Drivers":"Kexts";
      const legacy=assemblyCatalog.find(x=>x.id===item.id && x.folder===folder && x.file.toLowerCase()===item.name.toLowerCase());
      if(legacy){changePlanComponent(item.id,el.checked);return;}
      if(el.checked)ocdbSelected.add(el.dataset.ocdbChoice);else ocdbSelected.delete(el.dataset.ocdbChoice);
      save();renderMain();return;
    }
    if (el.dataset.planItem) {
        changePlanComponent(el.dataset.planItem, el.checked);
        return;
    }
    if (el.dataset.planCheck) {
        if (getAssemblyPlan(state.profile, state.plan).stale) {
            el.checked = false;
            toast(L("Revise as escolhas para o invent\u00E1rio atual antes de registrar novas confer\u00EAncias.", "Review choices for the current inventory before recording new checks."));
            return;
        }
        if (!state.plan.reviewedAgainst)
            state.plan.reviewedAgainst = assemblyFingerprint(state.profile);
        if (el.checked)
            state.plan.checks[el.dataset.planCheck] = true;
        else
            delete state.plan.checks[el.dataset.planCheck];
        save();
        return;
    }
    if (el.dataset.hardwareField)
        updateHardwareSelectionCount();
    if (el.dataset.task) {
        const id = el.dataset.task;
        if (el.checked)
            state.tasks[id] = "done";
        else
            delete state.tasks[id];
        el.closest(".task-row").classList.toggle("done", el.checked);
        save();
    }
    if (el.id === "task-filter") {
        taskFilter = el.value;
        renderMain();
    }
    if (el.dataset.profile && el.tagName === "SELECT") {
        state.profile[el.dataset.profile] = el.value;
        if (el.dataset.profile === "displayGpu")
            state.profile.displayConnection = "unknown";
        if (!state.profile.displayGpu)
            state.profile.displayConnection = "unknown";
        delete state.origins[el.dataset.profile];
        save();
        renderMain();
    }
    if (el.id === "projects-import-file" && el.files[0]) {
        fileReads++;
        try {
            if (el.files[0].size > 6000000) throw Error(L("Backup maior que 6 MB.", "Backup exceeds 6 MB."));
            const parsed = JSON.parse((await el.files[0].text()).replace(/^\uFEFF/, ""));
            const sources = parsed?.type === "opencore-project-collection" && Array.isArray(parsed.projects)
                ? parsed.projects.map(p => ({name:p.name, state:p.state, ocdbChoices:p.ocdbChoices}))
                : parsed?.type === "opencore-project" ? [parsed]
                : [{name: L("Projeto importado", "Imported project"), state:parsed, ocdbChoices:[]}];
            if (!sources.length || sources.length > 40 || projectsStore.projects.length + sources.length > 40) throw Error(L("Quantidade de projetos inválida ou limite de 40 excedido.", "Invalid project count or limit of 40 exceeded."));
            const candidates = sources.map(p => {
                if (!p || !p.state || typeof p.state !== "object") throw Error(L("Backup de projeto inválido.", "Invalid project backup."));
                const validated = cleanState(p.state);
                const selected = Array.isArray(p.ocdbChoices) ? p.ocdbChoices.filter(x=>typeof x==="string" && /^(SSDT|KEXT|DRIVER):[a-z0-9_-]{1,100}$/i.test(x)).slice(0,250) : [];
                return newProjectRecord(p.name || L("Projeto importado", "Imported project"), validated, selected);
            });
            if (!confirm(L.format("Importar {{0}} projeto(s) como novos registros, sem substituir os existentes?", "Import {{0}} project(s) as new entries without replacing existing ones?", [candidates.length]))) return;
            captureActiveProject();
            projectsStore.projects.push(...candidates);
            if (!persistProjects()) { projectsStore.projects.splice(-candidates.length); return; }
            renderMain(); toast(L("Projeto(s) importado(s). Abra o desejado na lista.", "Project(s) imported. Open one from the list."));
        } catch (error) {
            toast(error.message || L("Não foi possível importar o backup.", "Could not import the backup."));
        } finally { fileReads--; el.value = ""; }
        return;
    }
    if (el.id === "import-file" && el.files[0]) {
        fileReads++;
        try {
            if (el.files[0].size > 1000000)
                throw Error(L("Backup muito grande. O limite \u00E9 1 MB.", "Backup too large. The limit is 1 MB."));
            const incoming = cleanState(JSON.parse(await el.files[0].text()));
            if (confirm(L("Substituir o projeto local pelo backup selecionado?", "Replace the local project with the selected backup?"))) {
                state = incoming;
                save();
                navigate("overview");
                toast(L("Backup importado. Perfil, notas e marca\u00E7\u00F5es restaurados.", "Backup imported. Profile, notes and checks restored."));
            }
        }
        catch (error) {
            toast(error.message || L("N\u00E3o foi poss\u00EDvel importar este arquivo.", "Could not import this file."));
        }
        finally {
            fileReads--;
            el.value = "";
        }
    }
    if (el.id === "hardware-file" && el.files[0]) {
        fileReads++;
        try {
            if (el.files[0].size > 2000000)
                throw Error(L("Relat\u00F3rio muito grande. O limite \u00E9 2 MB; selecione somente o Hardware Report JSON.", "Report too large. The limit is 2 MB; select only the Hardware Report JSON."));
            const text = (await el.files[0].text()).replace(/^\uFEFF/, "");
            let json;
            try {
                json = JSON.parse(text);
            }
            catch {
                throw Error(L("JSON inv\u00E1lido. Selecione o arquivo de Export Hardware Report, n\u00E3o uma tabela ACPI ou arquivo compactado.", "Invalid JSON. Select the Export Hardware Report file, not an ACPI table or archive."));
            }
            const parsed = parseHardwareReport(json);
            showHardwarePreview(parsed);
        }
        catch (error) {
            toast(error.message || L("N\u00E3o foi poss\u00EDvel ler o relat\u00F3rio. Use o JSON do Export Hardware Report.", "Could not read the report. Use the Export Hardware Report JSON."));
        }
        finally {
            fileReads--;
            el.value = "";
        }
    }
});
guideListen("cancel", (e) => {
    if (e.target.id === "hardware-preview") {
        pendingHardwareReport = null;
        e.target.innerHTML = "";
    }
    if (e.target.id === "tree-preview")

guideListen("keydown", (e) => {

        document.getElementById("tree-preview").open)
        return;
    if (e.key === "/" &&
        !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {

        navigate("journey");
        document.getElementById("guide-search").focus();
    }
    if (e.key === "Escape")
        document.getElementById("sidebar").classList.remove("mobile-open");
});
if (initialUI.folderState?.guideRootHandle && initialUI.folderState?.projectFolderHandle) {
    const folder = initialUI.folderState;
    guideRootHandle = folder.guideRootHandle;
    projectFolderHandle = folder.projectFolderHandle;
    projectFolderFiles = folder.projectFolderFiles;

    ocdbRecords = folder.ocdbRecords;
    ocdbName = folder.ocdbName;
    ocdbSelected = new Set(folder.ocdbChoices);
    guideConnectionReady = true;
}
shell();
if (!guideConnectionReady) restoreGuideFolder();
  app.insertAdjacentHTML("beforeend", `<nav class="oc-floating-nav" id="oc-floating-nav" aria-label="${L("Atalhos de navegação", "Navigation shortcuts")}">
    <button type="button" data-action="floating-back" aria-label="${L("Voltar à página anterior", "Return to previous page")}" title="${L("Voltar à página anterior", "Return to previous page")}">←</button>
    <button type="button" data-action="floating-top" aria-label="${L("Voltar ao topo", "Back to top")}" title="${L("Voltar ao topo", "Back to top")}">↑</button>
  </nav>`);
  const updateFloatingNavigation = () => {
    const dock = document.getElementById("oc-floating-nav");
    if (dock) dock.classList.toggle("is-visible", window.scrollY > 320);
  };
  window.addEventListener("scroll", updateFloatingNavigation, { passive:true, signal:lifecycle.signal });
  updateFloatingNavigation();
if (!storageAvailable)
    toast(L("Armazenamento local indispon\u00EDvel. Use exportar backup para preservar seu projeto.", "Local storage unavailable. Export a backup to preserve your project."));

  if (initialState) {
    state = initialState
    view = initialUI.view || "overview"
    groupFilter = initialUI.groupFilter || "all"
    query = initialUI.query || ""
    taskFilter = initialUI.taskFilter || "all"
    kextFilter = initialUI.kextFilter || "all"
    activeChapter = initialUI.activeChapter || null
    activeExample = initialUI.activeExample || null
    lastPrimaryView = initialUI.lastPrimaryView || "profile"
    renderMain()
    const sections = document.querySelectorAll("details")
    for (const item of initialUI.details || []) {
      const section = item.id ? document.getElementById(item.id) : sections.length === initialUI.detailCount ? sections[item.index] : null
      if (section instanceof HTMLDetailsElement) section.open = item.open
    }
    window.scrollTo({ top: initialUI.scroll || 0, behavior: "instant" })
    document.querySelector('[data-action="language"]')?.focus({ preventScroll: true })
  }
  guideSession = {
    stop: () => { lifecycle.abort(); clearTimeout(toast.timer) },
    snapshot: () => state,
    report: () => report(),
    outline: () => exportAssemblyDocument(),
    publicHTML: pristineDocument,
  }
  // GUIDE_RUNTIME_READY
}
startGuide()
</script><script id="oc-github-version-checker">
(() => {
  'use strict';
  const KEY = 'oc-interativo-github-repository-v1';
  const DEFAULT_REPOSITORY = 'https://github.com/Demoonsz/opencore-interativo';
  const INSTALLED_VERSION = document.querySelector('meta[name="oc-guide-version"]')?.content || '2.0';
  const dialog = document.createElement('dialog');
  dialog.id = 'oc-version-dialog';
  dialog.innerHTML = `<form method="dialog"><h2 id="version-heading">Verificar versão</h2><p id="version-help">Informe o repositório público do projeto no GitHub. A consulta compara a edição instalada com a versão publicada nas Releases ou Tags.</p><label for="version-repository">Repositório do GitHub</label><input id="version-repository" autocomplete="url" placeholder="https://github.com/usuario/repositorio" aria-describedby="version-help"><div class="version-controls"><button class="button secondary small" value="cancel" id="version-close" type="submit">Fechar</button><button class="button small" type="button" id="version-run">Verificar agora</button></div><div class="version-result" id="version-result" role="status" aria-live="polite"></div></form>`;
  document.body.appendChild(dialog);
  const $ = id => document.getElementById(id);
  const en = () => document.documentElement.lang.toLowerCase().startsWith('en');
  const tr = (pt, english) => en() ? english : pt;
  const getRepo = input => {
    const value = input.trim().replace(/\/$/, '');
    const match = value.match(/^(?:https?:\/\/github\.com\/)?([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+?)(?:\.git)?$/i);
    if (!match) return null;
    return {owner:match[1], name:match[2]};
  };
  const versionParts = value => {
    const m = String(value || '').trim().match(/^[vV]?(\d+)\.(\d+)(?:\.(\d+))?(?:[-+].*)?$/);
    return m ? [Number(m[1]),Number(m[2]),Number(m[3] || 0)] : null;
  };
  const compare = (a,b) => {for(let i=0;i<3;i++){if(a[i]!==b[i])return Math.sign(a[i]-b[i]);}return 0;};
  const result = $('version-result');
  function setResult(message) {result.textContent = message;}
  function open() {
    $('version-heading').textContent = tr('Verificar versão','Check for updates');
    $('version-help').textContent = tr('Informe o repositório público do projeto no GitHub. A consulta compara esta edição com as Releases ou Tags publicadas.', 'Enter your public GitHub repository. The check compares this edition against published Releases or Tags.');
    $('version-close').textContent = tr('Fechar','Close');
    $('version-run').textContent = tr('Verificar agora','Check now');
    try { $('version-repository').value = localStorage.getItem(KEY) || DEFAULT_REPOSITORY; } catch { $('version-repository').value = DEFAULT_REPOSITORY; }
    setResult(tr(`Versão instalada: ${INSTALLED_VERSION}. Nenhuma consulta foi realizada ainda.`,`Installed version: ${INSTALLED_VERSION}. No check has been made yet.`));
    if (!dialog.open) dialog.showModal();
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action="github-version"]');
    if (!button) return;
    event.preventDefault();
    open();
  }, true);
  $('version-run').addEventListener('click', async () => {
    const raw = $('version-repository').value;
    const repo = getRepo(raw);
    if (!repo) {setResult(tr('Insira um endereço válido: https://github.com/usuario/repositorio','Enter a valid address: https://github.com/user/repository'));return;}
    try { localStorage.setItem(KEY, `https://github.com/${repo.owner}/${repo.name}`); } catch {}
    const api = `https://api.github.com/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.name)}`;
    $('version-run').disabled = true;
    setResult(tr('Consultando GitHub…','Checking GitHub…'));
    try {
      // Consultas têm limite de tempo para não prender a interface caso o GitHub não responda.
      const request = async path => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 11000);
        try {
          return await fetch(api + path, {
            headers: {Accept: 'application/vnd.github+json'},
            cache: 'no-store', signal: controller.signal
          });
        } finally { clearTimeout(timeout); }
      };
      const decode = response => {
        if (response.status === 403 || response.status === 429)
          throw new Error(tr('limite de consultas do GitHub atingido; tente novamente mais tarde', 'GitHub API rate limit reached; try again later'));
        if (!response.ok) throw new Error(`GitHub HTTP ${response.status}`);
        return response.json();
      };
      let published, url;
      const latestResponse = await request('/releases/latest');
      if (latestResponse.ok) {
        const release = await decode(latestResponse);
        if (versionParts(release.tag_name)) {
          published = release.tag_name; url = release.html_url;
        }
      } else if (latestResponse.status !== 404) {
        await decode(latestResponse);
      }
      // A API /releases/latest ignora pre-releases e pode responder 404 mesmo com releases.
      if (!published) {
        const releaseResponse = await request('/releases?per_page=30');
        if (releaseResponse.ok) {
          const releases = await decode(releaseResponse);
          const numbered = releases.map(r => ({name:r.tag_name,parts:versionParts(r.tag_name),url:r.html_url}))
            .filter(r => r.parts).sort((a,b)=>compare(b.parts,a.parts));
          if (numbered.length) {published=numbered[0].name;url=numbered[0].url;}
        } else if (releaseResponse.status !== 404) {
          await decode(releaseResponse);
        }
      }
      if (!published) {
        const tagsResponse = await request('/tags?per_page=100');
        const tags = await decode(tagsResponse);
        const numbered = tags.map(t => ({name:t.name,parts:versionParts(t.name)}))
          .filter(t=>t.parts).sort((a,b)=>compare(b.parts,a.parts));
        if (!numbered.length) {
          setResult(tr('Não encontrei Releases nem Tags com um número de versão neste repositório.',
            'No Releases or numbered Tags were found in this repository.'));
          return;
        }
        published=numbered[0].name;
        url=`https://github.com/${repo.owner}/${repo.name}/tree/${encodeURIComponent(published)}`;
      }
      const current=versionParts(INSTALLED_VERSION), latest=versionParts(published);
      const c=compare(latest,current);
      setResult(c>0 ? tr(`Nova versão disponível: ${published} (instalada: ${INSTALLED_VERSION}). `,`New version available: ${published} (installed: ${INSTALLED_VERSION}). `) : c===0 ? tr(`Você está na versão mais recente (${published}). `,`You are on the latest version (${published}). `) : tr(`Esta versão local (${INSTALLED_VERSION}) é mais recente que a publicada (${published}). `,`This local version (${INSTALLED_VERSION}) is newer than the published one (${published}). `));
      if(url && /^https:\/\/github\.com\//.test(url)) {
        const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';
        link.textContent=tr('Ver publicação no GitHub','View on GitHub');result.appendChild(link);
      }
    } catch(error) {
      const timedOut = error && error.name === 'AbortError';
      setResult(timedOut
        ? tr('A consulta demorou demais. Verifique a conexão e tente novamente.','The request timed out. Check your connection and try again.')
        : tr('Não foi possível consultar o GitHub: ','Could not reach GitHub: ')+String(error.message||error)+'. '+
          tr('Verifique sua conexão, o repositório público e tente novamente.','Check your connection and the public repository, then try again.'));
    }
    finally {$('version-run').disabled=false;}
  });
})();
</script></body></html>
